                    description: NOT_FOUND — không tìm thấy tài nguyên trong phạm vi cho phép
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "409":
                    description: CONFLICT — trùng định danh, trạng thái, thao tác đồng thời,
                        replay khác payload hoặc khoản đã thanh toán
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "422":
                    description: BUSINESS_RULE_VIOLATION — không đáp ứng điều kiện nghiệp vụ
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "500":
                    description: INTERNAL_ERROR — lỗi không dự kiến; trả requestId, không lộ
                        dữ liệu nhạy cảm
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/DriverAccountCreate"
            x-server-side-effects:
                - FR41
            x-acceptance-level: Mapping yêu cầu; cần backend và test case để nghiệm thu.
            x-uc-ids:
                - UC16
            x-permission-required: Quyền cụ thể cho chức năng + phạm vi dữ liệu; role OPERATIONS
                một mình không đủ.
components:
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            description: Đề xuất bearer session token; máy chủ kiểm tra phiên hết hạn/thu
                hồi và quyền ở từng API.
        ProviderSignature:
            type: apiKey
            in: header
            name: X-Provider-Signature
            description: Tên header/chữ ký là đề xuất adapter, phải chốt theo provider.
                Xác minh raw body và timestamp; không dùng JWT khách hàng.
    schemas:
        DriverAccountCreate:
            type: object
            additionalProperties: false
            properties:
                fullName: &id001
                    type: string
                    minLength: 1
                phoneNumber: &id002
                    type: string
                    minLength: 1
                    description: Đề xuất định danh bằng số điện thoại theo ERD; chuẩn hóa và
                        định dạng cần chốt, không đặt giới hạn số tùy ý.
                password:
                    type: string
                    minLength: 1
                    format: password
                    writeOnly: true
            required:
                - fullName
                - phoneNumber
                - password
        Error:
            type: object
            additionalProperties: false
            properties:
                code: *id001
                message: *id001
                requestId: *id001
                fieldErrors:
                    type: array
                    items:
                        type: object
                        additionalProperties: false
                        properties:
                            field: *id001
                            message: *id001
                        required:
                            - field
                            - message
            required:
                - code
                - message
                - requestId
        Login:
            type: object
            additionalProperties: false
            properties:
                phoneNumber: *id002
                password:
                    type: string
                    minLength: 1
                    format: password
                    writeOnly: true
            required:
                - phoneNumber
                - password
        PersonalProfileUpdate:
            type: object
            additionalProperties: false
            properties:
                fullName: *id001
                phoneNumber: *id002
            minProperties: 1
            description: Chỉ các trường cho phép; trường role, permissions, accountStatus
                bị từ chối. Danh sách trường có thể sửa là đề xuất cần chốt.
        Registration:
            type: object
            additionalProperties: false
            properties:
                fullName: *id001
                phoneNumber: *id002
                password:
                    type: string
                    minLength: 1
                    format: password
                    writeOnly: true
                role:
                    type: string
                    enum:
                        - CUSTOMER
                        - DRIVER
            required:
                - fullName
                - phoneNumber
                - password
                - role
        Session:
            type: object
            additionalProperties: false
            properties:
                accessToken: *id001
                tokenType:
                    type: string
                    enum:
                        - Bearer
                expiresAt:
                    type: string
                    format: date-time
                user:
                    $ref: "#/components/schemas/User"
            required:
                - accessToken
                - tokenType
                - expiresAt
                - user
        User:
            type: object
            additionalProperties: false
            properties:
                userId:
                    type: string
                    format: uuid
                fullName: *id001
                phoneNumber: *id002
                role:
                    type: string
                    enum:
                        - CUSTOMER
                        - DRIVER
                        - OPERATIONS
                accountStatus:
                    type: string
                    enum:
                        - ACTIVE
                        - INACTIVE
                createdAt:
                    type: string
                    format: date-time
            required:
                - userId
                - fullName
                - phoneNumber
                - role
                - accountStatus
                - createdAt
