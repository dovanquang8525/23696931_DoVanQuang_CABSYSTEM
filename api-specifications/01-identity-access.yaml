openapi: 3.0.3
info:
    title: CAB — Identity & Access
    version: 2.0.0-draft
    description: Đăng ký, xác thực, hồ sơ cá nhân dùng chung và tạo tài khoản tài xế.
        Identity quản lý định danh/phiên/quyền; không thay thế hồ sơ nghiệp vụ tài xế.
        FR40 áp dụng xuyên suốt. Nhóm tài liệu/module đề xuất; không xác nhận bounded
        context hay microservice độc lập.
servers:
    - url: http://localhost:3000/api/v1
      description: URL local đề xuất; thay bằng máy chủ thực tế khi có backend.
security:
    - BearerAuth: []
x-source: 02-srs.md
x-primary-fr-ids:
    - FR01
    - FR02
    - FR03
    - FR04
    - FR40
x-related-fr-ids:
    - FR01
    - FR02
    - FR03
    - FR04
    - FR40
    - FR41
x-ac-ids:
    - AC01
    - AC02
    - AC03
    - AC04
    - AC05
    - AC06
    - AC07
    - AC08
    - AC62
    - AC63
    - AC69
x-ac-criteria:
    AC01: Khi thông tin đăng ký hợp lệ và định danh chưa tồn tại, hệ thống tạo đúng
        một tài khoản với vai trò khách hàng hoặc tài xế được chọn.
    AC02: Khi thiếu trường bắt buộc, sai định dạng hoặc trùng định danh, hệ thống không
        tạo tài khoản và thông báo nội dung cần sửa.
    AC03: Khi thông tin đăng nhập đúng và tài khoản được phép hoạt động, hệ thống tạo
        phiên truy cập hợp lệ.
    AC04: Khi thông tin đăng nhập sai hoặc tài khoản không được phép hoạt động, hệ thống
        không tạo phiên truy cập.
    AC05: Khi người dùng gửi thông tin cá nhân hợp lệ trong phạm vi được sửa, hệ thống
        lưu thay đổi và hiển thị dữ liệu mới.
    AC06: Khi cập nhật không hợp lệ hoặc người dùng cố sửa vai trò, quyền qua hồ sơ
        cá nhân, hệ thống không lưu thay đổi đó.
    AC07: Nhân viên có quyền tạo được tài khoản tài xế từ dữ liệu hợp lệ; hệ thống ghi
        nhận người tạo và thời điểm.
    AC08: Dữ liệu không hợp lệ hoặc định danh đã tồn tại không tạo thêm tài khoản tài
        xế.
    AC62: Người chưa xác thực, phiên không hợp lệ hoặc không đủ quyền không được truy
        cập chức năng và dữ liệu bị hạn chế, kể cả khi gọi trực tiếp API.
    AC63: Thao tác thuộc danh sách lưu vết có bản ghi gồm người hoặc hệ thống thực hiện,
        hành động, đối tượng, thời điểm và kết quả.
    AC69: Phiên hết hạn hoặc bị thu hồi không truy cập được chức năng bảo vệ; quyền
        được kiểm tra tại máy chủ.
