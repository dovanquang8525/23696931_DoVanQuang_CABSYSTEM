openapi: 3.0.3
info:
    title: CAB — Fare & Payment
    version: 2.0.0-draft
    description: Sở hữu tính cước và từng lần thanh toán; tính cước từ dữ liệu chuyến
        hoàn thành. COMPLETED không phụ thuộc thành công thanh toán. Payment webhook là
        adapter đề xuất, phải chốt hợp đồng/chữ ký với provider. Tra cứu quản trị bằng
        danh sách lọc payment/trip/thời gian/trạng thái. Nhóm tài liệu/module đề xuất;
        không xác nhận bounded context hay microservice độc lập.
servers:
    - url: http://localhost:3000/api/v1
      description: URL local đề xuất; thay bằng máy chủ thực tế khi có backend.
