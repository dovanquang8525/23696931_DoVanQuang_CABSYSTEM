x-ac-criteria:
    AC37: Khi chuyến hoàn thành và đủ dữ liệu, hệ thống tính, lưu cước đúng công thức
        và quy tắc làm tròn đã thống nhất.
    AC38: Khi thiếu dữ liệu tính cước, hệ thống không xác nhận cước cuối cùng; giữ kết
        quả chuyến hoàn thành và ghi nhận cần xử lý cước.
    AC39: Khách hàng xem được khoản phải trả và lựa chọn tiền mặt hoặc phương thức điện
        tử được hỗ trợ.
    AC40: Thanh toán tiền mặt chỉ được ghi nhận thành công sau xác nhận của người có
        quyền; lưu số tiền, người xác nhận, thời điểm và chuyến liên quan.
    AC41: Giao dịch điện tử được tạo với đúng chuyến và số tiền; thông tin tham chiếu
        được lưu để theo dõi kết quả.
    AC42: Chỉ kết quả hợp lệ đã được xác minh từ nhà cung cấp mới làm thay đổi trạng
        thái thanh toán.
    AC43: Kết quả giao dịch gửi lặp không làm ghi nhận thu tiền nhiều lần; kết quả không
        hợp lệ không được ghi nhận thành công.
    AC44: Thanh toán thất bại được ghi nhận và thông báo; khách hàng xử lý lại theo
        chính sách, các lần xử lý vẫn tra cứu được.
    AC45: Giao dịch chưa rõ kết quả được kiểm tra trước khi cho phép trả lại; khoản
        đã thanh toán đủ không được thu lại trong luồng thông thường.
    AC46: Thanh toán thất bại hoặc đang chờ không làm chuyến đã hoàn thành trở thành
        chuyến chưa hoàn thành.
    AC47: Nhân viên có quyền tìm và xem được các lần thanh toán theo điều kiện; không
        có kết quả thì hiển thị danh sách trống.
    AC50: Kết quả thanh toán được thông báo cho đúng khách hàng và nhất quán với trạng
        thái đã ghi nhận.
    AC51: Lỗi gửi thông báo không làm đảo ngược hoặc mất kết quả đặt xe, cập nhật chuyến
        hay thanh toán đã lưu.
    AC62: Người chưa xác thực, phiên không hợp lệ hoặc không đủ quyền không được truy
        cập chức năng và dữ liệu bị hạn chế, kể cả khi gọi trực tiếp API.
    AC63: Thao tác thuộc danh sách lưu vết có bản ghi gồm người hoặc hệ thống thực hiện,
        hành động, đối tượng, thời điểm và kết quả.
    AC69: Phiên hết hạn hoặc bị thu hồi không truy cập được chức năng bảo vệ; quyền
        được kiểm tra tại máy chủ.
