components:
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            description: Đề xuất bearer session token; máy chủ kiểm tra phiên hết hạn/thu
                hồi và quyền ở từng API.
        ProviderSignature:
            type: apiKey
            in: header
            name: X-Provider-Signature
            description: Tên header/chữ ký là đề xuất adapter, phải chốt theo provider.
                Xác minh raw body và timestamp; không dùng JWT khách hàng.
    schemas:
        Bill:
            type: object
            additionalProperties: false
            properties:
                tripId:
                    type: string
                    format: uuid
                fareStatus:
                    type: string
                    enum:
                        - NOT_CALCULATED
                        - CALCULATED
                        - NEEDS_ATTENTION
                fareAmount:
                    type: number
                    minimum: 0
                    description: VND; quy tắc làm tròn do chính sách cước đã xác nhận quyết
                        định.
                    nullable: true
                cancellationFee:
                    type: number
                    minimum: 0
                    description: VND; quy tắc làm tròn do chính sách cước đã xác nhận quyết
                        định.
                    nullable: true
                amountDue:
                    type: number
                    minimum: 0
                    description: VND; quy tắc làm tròn do chính sách cước đã xác nhận quyết
                        định.
                    nullable: true
                currency:
                    type: string
                    enum:
                        - VND
                paymentStatus:
                    type: string
                    enum:
                        - UNPAID
                        - PENDING
                        - SUCCEEDED
                        - FAILED
                supportedMethods:
                    type: array
                    items:
                        type: string
                        enum:
                            - CASH
                            - ELECTRONIC
            required:
                - tripId
                - fareStatus
                - fareAmount
                - amountDue
                - currency
                - paymentStatus
                - supportedMethods
        CashConfirmation:
            type: object
            additionalProperties: false
            properties:
                collectedAmount: &id002
                    type: number
                    minimum: 0
                    description: VND; quy tắc làm tròn do chính sách cước đã xác nhận quyết
                        định.
            required:
                - collectedAmount
            description: So sánh số tiền đã thu với khoản phải trả; người xác nhận và thời
                điểm lấy từ phiên/máy chủ. Không lưu thành công nếu không đủ điều kiện.
        ElectronicPaymentInput:
            type: object
            additionalProperties: false
            properties:
                providerName: &id001
                    type: string
                    minLength: 1
            required:
                - providerName
            description: CAB tính số tiền từ khoản phải trả; không nhận amount, customerId
                hoặc trạng thái thành công từ khách hàng.
        Error:
            type: object
            additionalProperties: false
            properties:
                code: *id001
                message: *id001
                requestId: *id001
                fieldErrors:
                    type: array
                    items:
                        type: object
                        additionalProperties: false
                        properties:
                            field: *id001
                            message: *id001
                        required:
                            - field
                            - message
            required:
                - code
                - message
                - requestId
        Payment:
            type: object
            additionalProperties: false
            properties:
                paymentId:
                    type: string
                    format: uuid
                tripId:
                    type: string
                    format: uuid
                paymentMethod:
                    type: string
                    enum:
                        - CASH
                        - ELECTRONIC
                amount: *id002
                currency:
                    type: string
                    enum:
                        - VND
                paymentStatus:
                    type: string
                    enum:
                        - PENDING
                        - SUCCEEDED
                        - FAILED
                providerName:
                    type: string
                    minLength: 1
                    nullable: true
                providerTransactionId:
                    type: string
                    minLength: 1
                    nullable: true
                paymentUrl:
                    type: string
                    format: uri
                    nullable: true
                confirmedByUserId:
                    type: string
                    format: uuid
                    nullable: true
                failureReason:
                    type: string
                    minLength: 1
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
                paidAt:
                    type: string
                    format: date-time
                    nullable: true
            required:
                - paymentId
                - tripId
                - paymentMethod
                - amount
                - currency
                - paymentStatus
                - createdAt
        PaymentMethodInput:
            type: object
            additionalProperties: false
            properties:
                paymentMethod:
                    type: string
                    enum:
                        - CASH
                        - ELECTRONIC
            required:
                - paymentMethod
        PaymentPage:
            type: object
            additionalProperties: false
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Payment"
                page:
                    type: integer
                    minimum: 1
                pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                totalItems:
                    type: integer
                    minimum: 0
            required:
                - items
                - page
                - pageSize
                - totalItems
        PaymentWebhook:
            type: object
            additionalProperties: false
            properties:
                eventId: *id001
                providerTransactionId: *id001
                paymentId:
                    type: string
                    format: uuid
                amount: *id002
                currency:
                    type: string
                    enum:
                        - VND
                status:
                    type: string
                    enum:
                        - PENDING
                        - SUCCEEDED
                        - FAILED
                occurredAt:
                    type: string
                    format: date-time
            required:
                - eventId
                - providerTransactionId
                - paymentId
                - amount
                - currency
                - status
                - occurredAt
            description: DTO chuẩn hóa đề xuất; adapter theo nhà cung cấp thực tế phải xác
                minh chữ ký trên raw body, tham chiếu, tiền tệ, số tiền và chống replay trước
                khi ghi nhận.
        WebhookAcknowledgement:
            type: object
            additionalProperties: false
            properties:
                eventId: *id001
                accepted:
                    type: boolean
                duplicate:
                    type: boolean
            required:
                - eventId
                - accepted
                - duplicate
