openapi: 3.0.3
info:
    title: CAB — Rating & Feedback
    version: 2.0.0-draft
    description: Chỉ chủ chuyến đã COMPLETED được đánh giá tài xế; một review/trip.
        Thang điểm chưa chốt. SRS chỉ yêu cầu đánh giá, không thêm khiếu nại/phản hồi
        tổng quát CRUD. Nhóm tài liệu/module đề xuất; không xác nhận bounded context hay
        microservice độc lập.
servers:
    - url: http://localhost:3000/api/v1
      description: URL local đề xuất; thay bằng máy chủ thực tế khi có backend.
security:
    - BearerAuth: []
x-source: 02-srs.md
x-primary-fr-ids:
    - FR34
x-related-fr-ids:
    - FR34
    - FR40
    - FR41
x-ac-ids:
    - AC53
    - AC54
    - AC62
    - AC63
    - AC69
x-ac-criteria:
    AC53: Đánh giá được lưu khi người gửi là khách hàng của chuyến đã hoàn thành và
        điểm nằm trong thang cho phép.
    AC54: Chuyến chưa hoàn thành, chuyến của người khác, điểm không hợp lệ hoặc đánh
        giá trùng bị từ chối theo quy tắc đã thống nhất.
    AC62: Người chưa xác thực, phiên không hợp lệ hoặc không đủ quyền không được truy
        cập chức năng và dữ liệu bị hạn chế, kể cả khi gọi trực tiếp API.
    AC63: Thao tác thuộc danh sách lưu vết có bản ghi gồm người hoặc hệ thống thực hiện,
        hành động, đối tượng, thời điểm và kết quả.
    AC69: Phiên hết hạn hoặc bị thu hồi không truy cập được chức năng bảo vệ; quyền
        được kiểm tra tại máy chủ.
paths:
    /trips/{tripId}/reviews:
        post:
            tags:
                - Rating & Feedback
            summary: Đánh giá tài xế sau chuyến
            operationId: tripReviewCreate
            description: "Chỉ chủ chuyến COMPLETED, có tài xế được phân công, tối đa một
                review/trip. Thang điểm từ chính sách đã chốt; điểm ngoài thang trả 422, đã
                có review với thao tác khác trả 409.


                Quyền: CUSTOMER. Kiểm tra quyền và phạm vi dữ liệu tại máy chủ."
            x-fr-ids:
                - FR34
                - FR40
                - FR41
            x-ac-ids:
                - AC53
                - AC54
                - AC62
                - AC63
                - AC69
            x-roles:
                - CUSTOMER
            x-source: 02-srs.md; §§7, 8, 9, 13, 14
            responses:
                "201":
                    description: Đánh giá tài xế sau chuyến — thành công
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Review"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "400":
                    description: INVALID_REQUEST — dữ liệu/định dạng/khoảng thời gian không
                        hợp lệ
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "401":
                    description: UNAUTHENTICATED — thông tin đăng nhập, phiên hoặc chữ ký không
                        hợp lệ
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "403":
                    description: FORBIDDEN — sai quyền, sai chủ sở hữu hoặc tài khoản không
                        được phép hoạt động
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "404":
                    description: NOT_FOUND — không tìm thấy tài nguyên trong phạm vi cho phép
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "409":
                    description: CONFLICT — trùng định danh, trạng thái, thao tác đồng thời,
                        replay khác payload hoặc khoản đã thanh toán
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "422":
                    description: BUSINESS_RULE_VIOLATION — không đáp ứng điều kiện nghiệp vụ
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "500":
                    description: INTERNAL_ERROR — lỗi không dự kiến; trả requestId, không lộ
                        dữ liệu nhạy cảm
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
            x-idempotency:
                scope: actor + method + resource + key
                payloadConflictStatus: 409
                replay: Return original result; do not repeat business effects.
            parameters:
                - name: tripId
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
                - name: Idempotency-Key
                  in: header
                  required: true
                  schema:
                      type: string
                      minLength: 1
                  description: Một khóa cho một thao tác, gắn actor + endpoint + hash payload.
                      Gửi lại cùng payload trả kết quả cũ; đổi payload cùng khóa trả 409. Thời
                      gian lưu khóa cần chốt.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ReviewInput"
            x-server-side-effects:
                - FR41
            x-acceptance-level: Mapping yêu cầu; cần backend và test case để nghiệm thu.
            x-uc-ids:
                - UC09
components:
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            description: Đề xuất bearer session token; máy chủ kiểm tra phiên hết hạn/thu
                hồi và quyền ở từng API.
        ProviderSignature:
            type: apiKey
            in: header
            name: X-Provider-Signature
            description: Tên header/chữ ký là đề xuất adapter, phải chốt theo provider.
                Xác minh raw body và timestamp; không dùng JWT khách hàng.
    schemas:
        Error:
            type: object
            additionalProperties: false
            properties:
                code: &id001
                    type: string
                    minLength: 1
                message: *id001
                requestId: *id001
                fieldErrors:
                    type: array
                    items:
                        type: object
                        additionalProperties: false
                        properties:
                            field: *id001
                            message: *id001
                        required:
                            - field
                            - message
            required:
                - code
                - message
                - requestId
        Review:
            type: object
            additionalProperties: false
            properties:
                reviewId:
                    type: string
                    format: uuid
                tripId:
                    type: string
                    format: uuid
                rating:
                    type: integer
                comment:
                    type: string
                createdAt:
                    type: string
                    format: date-time
            required:
                - reviewId
                - tripId
                - rating
                - createdAt
        ReviewInput:
            type: object
            additionalProperties: false
            properties:
                rating:
                    type: integer
                    description: Thang điểm cần chốt; không mặc định 1–5. Máy chủ kiểm tra với
                        cấu hình đã phê duyệt.
                comment:
                    type: string
            required:
                - rating
