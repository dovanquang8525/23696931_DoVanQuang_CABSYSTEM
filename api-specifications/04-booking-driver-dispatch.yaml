x-ac-criteria:
    AC16: Vị trí không đáp ứng điều kiện về độ mới được xử lý theo chính sách; không
        được mặc nhiên dùng như vị trí hiện tại hợp lệ.
    AC17: Với điểm đón, điểm đến và loại xe hợp lệ, hệ thống ghi nhận yêu cầu đặt xe
        và hiển thị trạng thái đang tìm tài xế.
    AC18: Khi thông tin đặt xe không hợp lệ, hệ thống không đưa yêu cầu vào tìm tài
        xế và thông báo trường cần sửa.
    AC19: Khi gửi lại cùng một thao tác tạo yêu cầu do lỗi kết nối, hệ thống không tạo
        nhiều yêu cầu trùng cho thao tác đó.
    AC20: Danh sách tài xế được xét chỉ gồm người sẵn sàng, phù hợp loại xe và đáp ứng
        các điều kiện vận hành đã thống nhất.
    AC21: Thứ tự mời tài xế tuân thủ chính sách ưu tiên đã thống nhất, có xét khoảng
        cách đến điểm đón.
    AC22: Lời mời được gửi đến đúng tài xế được chọn, có thông tin chuyến cần thiết
        và thời hạn phản hồi.
    AC23: Phản hồi chấp nhận hoặc từ chối của đúng tài xế được ghi nhận khi lời mời
        còn hiệu lực.
    AC24: Phản hồi sau khi lời mời hết hiệu lực không được dùng để xác nhận phân công.
    AC25: Phân công chỉ thành công khi yêu cầu còn hiệu lực, lời mời hợp lệ và tài xế
        chưa bận chuyến khác.
    AC26: Khi có thao tác đồng thời, mỗi chuyến chỉ được phân công một tài xế và mỗi
        tài xế không được nhận hai chuyến đang thực hiện.
    AC27: Khi tài xế từ chối, hết hạn hoặc không còn đủ điều kiện, hệ thống tìm tài
        xế khác trong cùng yêu cầu; khách hàng không phải đặt lại.
    AC28: Khi không còn tài xế phù hợp hoặc đạt giới hạn tìm kiếm, hệ thống kết thúc
        tìm và thông báo không tìm được tài xế; không ghi nhận thành khách hàng hủy.
    AC48: Khách hàng nhận thông báo tại các mốc tiếp nhận yêu cầu, phân công, đến điểm
        đón và hoàn thành; thông báo hủy được gửi đến bên liên quan.
    AC51: Lỗi gửi thông báo không làm đảo ngược hoặc mất kết quả đặt xe, cập nhật chuyến
        hay thanh toán đã lưu.
    AC62: Người chưa xác thực, phiên không hợp lệ hoặc không đủ quyền không được truy
        cập chức năng và dữ liệu bị hạn chế, kể cả khi gọi trực tiếp API.
    AC63: Thao tác thuộc danh sách lưu vết có bản ghi gồm người hoặc hệ thống thực hiện,
        hành động, đối tượng, thời điểm và kết quả.
    AC69: Phiên hết hạn hoặc bị thu hồi không truy cập được chức năng bảo vệ; quyền
        được kiểm tra tại máy chủ.
paths:
