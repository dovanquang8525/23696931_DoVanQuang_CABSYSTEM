                kết thúc NO_DRIVER; không đánh dấu CANCELLED khi không tìm được xe. Notification
                qua outbox/retry độc lập (đề xuất thiết kế).


                Quyền: CUSTOMER. Kiểm tra quyền và phạm vi dữ liệu tại máy chủ."
