openapi: 3.0.3
info:
    title: CAB — Booking & Driver Dispatch
    version: 2.0.0-draft
    description: API vào của quy trình đặt xe. Workflow nền lọc/xếp/mời tài xế, timeout/từ
        chối thì tìm tiếp; xác nhận phân công nguyên tử. Booking là tên nghiệp vụ, chưa
        phải thực thể Booking mới; SRS dùng Trip. Trip Management sở hữu vòng đời Trip,
        dispatch sở hữu lời mời/candidate policy, phối hợp qua giao diện nội bộ. Nhóm
        tài liệu/module đề xuất; không xác nhận bounded context hay microservice độc lập.
servers:
    - url: http://localhost:3000/api/v1
      description: URL local đề xuất; thay bằng máy chủ thực tế khi có backend.
security:
    - BearerAuth: []
