components:
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            description: Đề xuất bearer session token; máy chủ kiểm tra phiên hết hạn/thu
                hồi và quyền ở từng API.
        ProviderSignature:
            type: apiKey
            in: header
            name: X-Provider-Signature
            description: Tên header/chữ ký là đề xuất adapter, phải chốt theo provider.
                Xác minh raw body và timestamp; không dùng JWT khách hàng.
    schemas:
        Error:
            type: object
            additionalProperties: false
            properties:
                code: &id001
                    type: string
                    minLength: 1
                message: *id001
                requestId: *id001
                fieldErrors:
                    type: array
                    items:
                        type: object
                        additionalProperties: false
                        properties:
                            field: *id001
                            message: *id001
                        required:
                            - field
                            - message
            required:
                - code
                - message
                - requestId
        SupportCase:
            type: object
            additionalProperties: false
            properties:
                supportCaseId:
                    type: string
                    format: uuid
                tripId:
                    type: string
                    format: uuid
                paymentId:
                    type: string
                    format: uuid
                    nullable: true
                handledByUserId:
                    type: string
                    format: uuid
                    nullable: true
                issueType: *id001
                description: *id001
                caseStatus:
                    type: string
                    enum:
                        - OPEN
                        - IN_PROGRESS
                        - RESOLVED
                resolution:
                    type: string
                    minLength: 1
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
                resolvedAt:
                    type: string
                    format: date-time
                    nullable: true
            required:
                - supportCaseId
                - tripId
                - issueType
                - description
                - caseStatus
                - createdAt
        SupportCaseCreate:
            type: object
            additionalProperties: false
            properties:
                tripId:
                    type: string
                    format: uuid
                paymentId:
                    type: string
                    format: uuid
                issueType: *id001
                description: *id001
            required:
                - tripId
                - issueType
                - description
        SupportCaseUpdate:
            type: object
            additionalProperties: false
            properties:
                caseStatus:
                    type: string
                    enum:
                        - OPEN
                        - IN_PROGRESS
                        - RESOLVED
                resolution: *id001
            minProperties: 1
            description: Khi RESOLVED bắt buộc có resolution ở tầng nghiệp vụ; không cho
                phép tự sửa cước, trạng thái chuyến/thanh toán hoặc actor qua API này.
