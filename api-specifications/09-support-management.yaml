openapi: 3.0.3
info:
    title: CAB — Support Management
    version: 2.0.0-draft
    description: Hồ sơ sự cố và kết quả xử lý. Nếu gắn paymentId phải thuộc tripId;
        sửa cước/hoàn tiền không tự suy ra từ quyền cập nhật hồ sơ hỗ trợ. Nhóm tài liệu/module
        đề xuất; không xác nhận bounded context hay microservice độc lập.
servers:
    - url: http://localhost:3000/api/v1
      description: URL local đề xuất; thay bằng máy chủ thực tế khi có backend.
security:
    - BearerAuth: []
x-source: 02-srs.md
x-primary-fr-ids:
    - FR38
x-related-fr-ids:
    - FR38
    - FR40
    - FR41
x-ac-ids:
    - AC58
    - AC59
    - AC62
    - AC63
    - AC69
x-ac-criteria:
    AC58: Hồ sơ sự cố được lưu với chuyến, nội dung và trạng thái; nếu gắn giao dịch,
        giao dịch phải thuộc cùng chuyến.
    AC59: Kết quả xử lý được lưu cùng người xử lý và thời điểm; người vượt quyền không
        được thực hiện biện pháp xử lý bị hạn chế.
    AC62: Người chưa xác thực, phiên không hợp lệ hoặc không đủ quyền không được truy
        cập chức năng và dữ liệu bị hạn chế, kể cả khi gọi trực tiếp API.
    AC63: Thao tác thuộc danh sách lưu vết có bản ghi gồm người hoặc hệ thống thực hiện,
        hành động, đối tượng, thời điểm và kết quả.
    AC69: Phiên hết hạn hoặc bị thu hồi không truy cập được chức năng bảo vệ; quyền
        được kiểm tra tại máy chủ.
paths:
