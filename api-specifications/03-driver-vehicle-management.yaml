                            schema:
                                $ref: "#/components/schemas/Vehicle"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "400":
                    description: INVALID_REQUEST — dữ liệu/định dạng/khoảng thời gian không
                        hợp lệ
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "401":
                    description: UNAUTHENTICATED — thông tin đăng nhập, phiên hoặc chữ ký không
                        hợp lệ
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "403":
                    description: FORBIDDEN — sai quyền, sai chủ sở hữu hoặc tài khoản không
                        được phép hoạt động
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "404":
                    description: NOT_FOUND — không tìm thấy tài nguyên trong phạm vi cho phép
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "409":
                    description: CONFLICT — trùng định danh, trạng thái, thao tác đồng thời,
                        replay khác payload hoặc khoản đã thanh toán
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "422":
                    description: BUSINESS_RULE_VIOLATION — không đáp ứng điều kiện nghiệp vụ
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "500":
                    description: INTERNAL_ERROR — lỗi không dự kiến; trả requestId, không lộ
                        dữ liệu nhạy cảm
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
            parameters:
                - name: vehicleId
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/VehicleUpdate"
            x-server-side-effects:
                - FR41
            x-acceptance-level: Mapping yêu cầu; cần backend và test case để nghiệm thu.
            x-uc-ids:
                - UC11
                - UC19
            x-permission-policy:
                DRIVER: Only own vehicles; actor driverId resolved from session.
                OPERATIONS: Requires vehicles.read or vehicles.write and authorized data scope.
            x-permission-required: Quyền cụ thể cho chức năng + phạm vi dữ liệu; role OPERATIONS
                một mình không đủ.
components:
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            description: Đề xuất bearer session token; máy chủ kiểm tra phiên hết hạn/thu
                hồi và quyền ở từng API.
        ProviderSignature:
            type: apiKey
            in: header
            name: X-Provider-Signature
            description: Tên header/chữ ký là đề xuất adapter, phải chốt theo provider.
                Xác minh raw body và timestamp; không dùng JWT khách hàng.
    schemas:
        AvailabilityInput:
            type: object
            additionalProperties: false
            properties:
                availabilityStatus:
                    type: string
                    enum:
                        - AVAILABLE
                        - UNAVAILABLE
            required:
                - availabilityStatus
        DriverLocation:
            type: object
            additionalProperties: false
            properties:
                latitude:
                    type: number
                    minimum: -90
                    maximum: 90
                longitude:
                    type: number
                    minimum: -180
                    maximum: 180
                observedAt:
                    type: string
                    format: date-time
                receivedAt:
                    type: string
                    format: date-time
                freshness:
                    type: string
                    enum:
                        - FRESH
                        - STALE
                        - UNKNOWN
            required:
                - latitude
                - longitude
                - observedAt
                - receivedAt
                - freshness
        DriverProfile:
            type: object
            additionalProperties: false
            properties:
                driverId:
                    type: string
                    format: uuid
                userId:
                    type: string
                    format: uuid
                licenseNumber:
                    type: string
                    minLength: 1
                    nullable: true
                availabilityStatus:
                    type: string
                    enum:
                        - AVAILABLE
                        - UNAVAILABLE
                isBusy:
                    type: boolean
                location:
                    $ref: "#/components/schemas/DriverLocation"
            required:
                - driverId
                - userId
                - availabilityStatus
                - isBusy
        DriverProfilePage:
            type: object
            additionalProperties: false
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/DriverProfile"
                page:
                    type: integer
                    minimum: 1
                pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                totalItems:
                    type: integer
                    minimum: 0
            required:
                - items
                - page
                - pageSize
                - totalItems
        DriverProfileUpdate:
            type: object
            additionalProperties: false
            properties:
                licenseNumber: &id001
                    type: string
                    minLength: 1
            required:
                - licenseNumber
            description: Các trường nghiệp vụ được sửa cần xác nhận; không cập nhật vị trí/trạng
                thái nhận chuyến tại API hồ sơ.
        Error:
            type: object
            additionalProperties: false
            properties:
                code: *id001
                message: *id001
                requestId: *id001
                fieldErrors:
                    type: array
                    items:
                        type: object
                        additionalProperties: false
                        properties:
                            field: *id001
                            message: *id001
                        required:
                            - field
                            - message
            required:
                - code
                - message
                - requestId
        LocationInput:
            type: object
            additionalProperties: false
            properties:
                latitude:
                    type: number
                    minimum: -90
                    maximum: 90
                longitude:
                    type: number
                    minimum: -180
                    maximum: 180
                observedAt:
                    type: string
                    format: date-time
            required:
                - latitude
                - longitude
                - observedAt
        Vehicle:
            type: object
            additionalProperties: false
            properties:
                vehicleId:
                    type: string
                    format: uuid
                driverId:
                    type: string
                    format: uuid
                vehicleTypeId:
                    type: string
                    format: uuid
                plateNumber: *id001
                model: *id001
                vehicleStatus:
                    type: string
                    enum:
                        - ACTIVE
                        - INACTIVE
            required:
                - vehicleId
                - driverId
                - vehicleTypeId
                - plateNumber
                - model
                - vehicleStatus
        VehicleCreate:
            type: object
            additionalProperties: false
            properties:
                driverId:
                    type: string
                    format: uuid
                    description: OPERATIONS bắt buộc gửi driverId hợp lệ theo quyền; DRIVER
                        bỏ trường này hoặc chỉ gửi driverId của mình. Máy chủ kiểm tra ownership,
                        không cho tài xế chọn chủ xe khác.
                vehicleTypeId:
                    type: string
                    format: uuid
                plateNumber: *id001
                model: *id001
            required:
                - vehicleTypeId
                - plateNumber
                - model
        VehiclePage:
            type: object
            additionalProperties: false
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/Vehicle"
                page:
                    type: integer
                    minimum: 1
                pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                totalItems:
                    type: integer
                    minimum: 0
            required:
                - items
                - page
                - pageSize
                - totalItems
        VehicleType:
            type: object
            additionalProperties: false
            properties:
                vehicleTypeId:
                    type: string
                    format: uuid
                typeName: *id001
                isActive:
                    type: boolean
            required:
                - vehicleTypeId
                - typeName
                - isActive
        VehicleTypePage:
            type: object
            additionalProperties: false
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/VehicleType"
                page:
                    type: integer
                    minimum: 1
                pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                totalItems:
                    type: integer
                    minimum: 0
            required:
                - items
                - page
                - pageSize
                - totalItems
        VehicleUpdate:
            type: object
            additionalProperties: false
            properties:
                vehicleTypeId:
                    type: string
                    format: uuid
                plateNumber: *id001
                model: *id001
            minProperties: 1
