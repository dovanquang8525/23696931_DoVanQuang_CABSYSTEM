openapi: 3.0.3
info:
    title: CAB — Driver & Vehicle Management
    version: 2.0.0-draft
    description: Sở hữu hồ sơ, phương tiện, trạng thái nhận chuyến và vị trí. isBusy
        do vòng đời phân công quyết định, tài xế không tự ghi đè. Nhóm tài liệu/module
        đề xuất; không xác nhận bounded context hay microservice độc lập.
servers:
    - url: http://localhost:3000/api/v1
      description: URL local đề xuất; thay bằng máy chủ thực tế khi có backend.
security:
    - BearerAuth: []
x-source: 02-srs.md
x-primary-fr-ids:
    - FR05
    - FR06
    - FR07
    - FR08
x-related-fr-ids:
    - FR05
    - FR06
    - FR07
    - FR08
    - FR09
    - FR36
    - FR40
    - FR41
x-ac-ids:
    - AC09
    - AC10
    - AC11
    - AC12
    - AC13
    - AC14
    - AC15
    - AC16
    - AC17
    - AC18
    - AC56
    - AC62
    - AC63
    - AC69
x-ac-criteria:
    AC09: Tài xế sửa được trường hồ sơ của mình được phép sửa; nhân viên sửa được hồ
        sơ trong phạm vi quyền; dữ liệu hợp lệ được lưu.
    AC10: Dữ liệu hồ sơ không hợp lệ hoặc thao tác ngoài quyền không làm thay đổi hồ
        sơ đã lưu.
    AC11: Phương tiện chỉ được tạo hoặc cập nhật khi biển số không trùng phương tiện
        khác, loại xe và tài xế liên quan hợp lệ.
    AC12: Tài xế không được cập nhật phương tiện ngoài quyền quản lý; thay đổi ảnh hưởng
        chuyến đang diễn ra phải tuân thủ chính sách đã thống nhất.
    AC13: Tài xế đủ điều kiện có thể bật sẵn sàng; khi chuyển sang không sẵn sàng, tài
        xế không được xét cho chuyến mới.
    AC14: Tài xế đang thực hiện chuyến không được coi là tài xế rảnh để nhận thêm; tắt
        nhận chuyến mới không tự hủy chuyến đã nhận.
    AC15: Vị trí tài xế hợp lệ được lưu cùng thời điểm cập nhật; vị trí không hợp lệ
        không ghi đè vị trí hợp lệ đang có.
    AC16: Vị trí không đáp ứng điều kiện về độ mới được xử lý theo chính sách; không
        được mặc nhiên dùng như vị trí hiện tại hợp lệ.
    AC17: Với điểm đón, điểm đến và loại xe hợp lệ, hệ thống ghi nhận yêu cầu đặt xe
        và hiển thị trạng thái đang tìm tài xế.
    AC18: Khi thông tin đặt xe không hợp lệ, hệ thống không đưa yêu cầu vào tìm tài
        xế và thông báo trường cần sửa.
    AC56: Nhân viên có quyền xem chuyến đang diễn ra, trạng thái tài xế và chi tiết
        được phép; dữ liệu chưa cập nhật được nhận diện rõ.
    AC62: Người chưa xác thực, phiên không hợp lệ hoặc không đủ quyền không được truy
        cập chức năng và dữ liệu bị hạn chế, kể cả khi gọi trực tiếp API.
    AC63: Thao tác thuộc danh sách lưu vết có bản ghi gồm người hoặc hệ thống thực hiện,
        hành động, đối tượng, thời điểm và kết quả.
    AC69: Phiên hết hạn hoặc bị thu hồi không truy cập được chức năng bảo vệ; quyền
        được kiểm tra tại máy chủ.
