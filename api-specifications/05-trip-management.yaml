openapi: 3.0.3
info:
    title: CAB — Trip Management
    version: 2.0.0-draft
    description: Sở hữu trạng thái/vòng đời Trip. Lịch sử là truy vấn dữ liệu, không
        phải aggregate/bảng mới. Theo dõi chuyến hiện tại dùng danh sách có lọc trạng
        thái và chi tiết theo tripId. Hủy phải phối hợp dispatch dừng tìm/vô hiệu lời
        mời, không ghi trực tiếp dữ liệu của nhau nếu sau này tách service. Nhóm tài liệu/module
        đề xuất; không xác nhận bounded context hay microservice độc lập.
servers:
    - url: http://localhost:3000/api/v1
      description: URL local đề xuất; thay bằng máy chủ thực tế khi có backend.
