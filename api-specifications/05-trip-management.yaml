                scope: actor + method + resource + key
                payloadConflictStatus: 409
                replay: Return original result; do not repeat business effects.
            parameters:
                - name: tripId
                  in: path
                  required: true
                  schema:
                      type: string
                      format: uuid
                - name: Idempotency-Key
                  in: header
                  required: true
                  schema:
