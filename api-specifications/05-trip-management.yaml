x-ac-criteria:
    AC16: Vị trí không đáp ứng điều kiện về độ mới được xử lý theo chính sách; không
        được mặc nhiên dùng như vị trí hiện tại hợp lệ.
    AC29: Tài xế được phân công cập nhật được các mốc hợp lệ; mỗi mốc được lưu cùng
        thời điểm và hiển thị trạng thái mới.
    AC30: Cập nhật sai thứ tự, bởi tài xế khác hoặc trên chuyến đã kết thúc bị từ chối;
        trạng thái hiện tại được giữ nguyên.
    AC31: Gửi lại cùng thao tác cập nhật không tạo thêm chuyển trạng thái hoặc ghi đè
        sai thời điểm của mốc đã ghi nhận.
    AC32: Khách hàng xem được trạng thái chuyến của mình và thông tin tài xế sau khi
        phân công; không xem được chuyến của khách hàng khác.
    AC33: Khi có dữ liệu đủ điều kiện, thời gian đến dự kiến được hiển thị; khi không
        đủ dữ liệu, hệ thống hiển thị chưa có ước tính.
    AC34: Hệ thống kiểm tra quyền, trạng thái và điều kiện hủy; yêu cầu không đủ điều
        kiện bị từ chối với thông báo lý do.
    AC35: Sau xác nhận hủy hợp lệ, hệ thống lưu người hủy, thời điểm, lý do; dừng tìm
        hoặc kết thúc phân công và không tiếp tục phân công chuyến đã hủy.
    AC36: Phí hủy chỉ được áp dụng theo chính sách và được hiển thị trước xác nhận;
        nếu khách hàng không xác nhận, chuyến chưa bị hủy bởi yêu cầu đó.
    AC37: Khi chuyến hoàn thành và đủ dữ liệu, hệ thống tính, lưu cước đúng công thức
        và quy tắc làm tròn đã thống nhất.
    AC38: Khi thiếu dữ liệu tính cước, hệ thống không xác nhận cước cuối cùng; giữ kết
        quả chuyến hoàn thành và ghi nhận cần xử lý cước.
    AC46: Thanh toán thất bại hoặc đang chờ không làm chuyến đã hoàn thành trở thành
        chuyến chưa hoàn thành.
    AC48: Khách hàng nhận thông báo tại các mốc tiếp nhận yêu cầu, phân công, đến điểm
        đón và hoàn thành; thông báo hủy được gửi đến bên liên quan.
    AC49: Thay đổi liên quan đến chuyến được thông báo đúng tài xế được phân công.
    AC51: Lỗi gửi thông báo không làm đảo ngược hoặc mất kết quả đặt xe, cập nhật chuyến
        hay thanh toán đã lưu.
    AC52: Khách hàng xem được danh sách, chi tiết và khoản phải trả của chuyến thuộc
        mình; chuyến chưa xác định cước được hiển thị rõ.
    AC56: Nhân viên có quyền xem chuyến đang diễn ra, trạng thái tài xế và chi tiết
        được phép; dữ liệu chưa cập nhật được nhận diện rõ.
    AC57: Lịch sử chuyến được trả về đúng điều kiện lọc và phạm vi quyền; khoảng thời
        gian không hợp lệ được yêu cầu sửa.
    AC62: Người chưa xác thực, phiên không hợp lệ hoặc không đủ quyền không được truy
        cập chức năng và dữ liệu bị hạn chế, kể cả khi gọi trực tiếp API.
    AC63: Thao tác thuộc danh sách lưu vết có bản ghi gồm người hoặc hệ thống thực hiện,
        hành động, đối tượng, thời điểm và kết quả.
    AC69: Phiên hết hạn hoặc bị thu hồi không truy cập được chức năng bảo vệ; quyền
        được kiểm tra tại máy chủ.
paths:
    /drivers/me/trips/{tripId}/status-events:
        post:
            tags:
                - Trip Management
            summary: Cập nhật mốc chuyến
            operationId: driverTripStatusUpdate
            description: "Chuỗi đề xuất ASSIGNED → ARRIVED → PICKED_UP → IN_PROGRESS → COMPLETED.
                Thời điểm mốc lấy từ máy chủ. Lặp thao tác không đổi thời điểm; trạng thái
                sai thứ tự trả 409. COMPLETED kích hoạt tính cước; thiếu dữ liệu giữ COMPLETED,
                fareStatus=NEEDS_ATTENTION và fareAmount=null. Công thức/làm tròn chưa chốt.


                Quyền: DRIVER. Kiểm tra quyền và phạm vi dữ liệu tại máy chủ."
            x-fr-ids:
                - FR17
                - FR22
                - FR30
                - FR40
                - FR41
            x-ac-ids:
                - AC29
                - AC30
                - AC31
                - AC37
                - AC38
                - AC46
                - AC48
                - AC51
                - AC62
                - AC63
                - AC69
            x-roles:
                - DRIVER
            x-source: 02-srs.md; §§7, 8, 9, 13, 14
            responses:
                "200":
                    description: Cập nhật mốc chuyến — thành công
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Trip"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "400":
                    description: INVALID_REQUEST — dữ liệu/định dạng/khoảng thời gian không
                        hợp lệ
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "401":
                    description: UNAUTHENTICATED — thông tin đăng nhập, phiên hoặc chữ ký không
                        hợp lệ
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "403":
                    description: FORBIDDEN — sai quyền, sai chủ sở hữu hoặc tài khoản không
                        được phép hoạt động
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "404":
                    description: NOT_FOUND — không tìm thấy tài nguyên trong phạm vi cho phép
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "409":
                    description: CONFLICT — trùng định danh, trạng thái, thao tác đồng thời,
                        replay khác payload hoặc khoản đã thanh toán
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "422":
                    description: BUSINESS_RULE_VIOLATION — không đáp ứng điều kiện nghiệp vụ
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
                "500":
                    description: INTERNAL_ERROR — lỗi không dự kiến; trả requestId, không lộ
                        dữ liệu nhạy cảm
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                    headers:
                        X-Request-Id:
                            description: Mã liên kết yêu cầu và lỗi, không chứa dữ liệu nhạy cảm.
                            schema:
                                type: string
