components:
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            description: Đề xuất bearer session token; máy chủ kiểm tra phiên hết hạn/thu
                hồi và quyền ở từng API.
        ProviderSignature:
            type: apiKey
            in: header
            name: X-Provider-Signature
            description: Tên header/chữ ký là đề xuất adapter, phải chốt theo provider.
                Xác minh raw body và timestamp; không dùng JWT khách hàng.
    schemas:
        Address:
            type: object
            additionalProperties: false
            properties:
                address: &id001
                    type: string
                    minLength: 1
                latitude:
                    type: number
                    minimum: -90
                    maximum: 90
                longitude:
                    type: number
                    minimum: -180
                    maximum: 180
            required:
                - address
                - latitude
                - longitude
        CancellationConfirm:
            type: object
            additionalProperties: false
            properties:
                confirmed:
                    type: boolean
                    enum:
                        - true
            required:
                - confirmed
        CancellationQuote:
            type: object
            additionalProperties: false
            properties:
                cancellationId:
                    type: string
                    format: uuid
                tripId:
                    type: string
                    format: uuid
                reason: *id001
                feeAmount:
