syntax = "proto3";
package cab.auth.v1;
import "common.proto";
// Deadline <=5s and forwarded remaining budget. JWT/internal identity in metadata.
// Each method validates caller allowlist, types, enum values, role and ownership.
message RequestOtpRequest {
  string phone = 1;
  string purpose = 2;
}

message OtpChallenge {
  string otp_id = 1;
  string expires_at = 2;
  optional string mock_code = 3;
}

message VerifyOtpRequest {
  string otp_id = 1;
  string phone = 2;
  string code = 3;
}

message OtpVerification {
  string otp_id = 1;
  bool verified = 2;
  string expires_at = 3;
}

message RegisterRequest {
  string phone = 1;
  string password = 2;
  reserved 3, 4, 5; // Former name/role/OTP proof input. Current Driver confirmation uses code + phone.
  string email = 6;
  reserved 7, 8; // Former client-supplied profile codes; now allocated by Auth.
  optional string plate_number = 9;
  optional string code = 10;
}

message Registration {
  string account_id = 1;
  cab.common.v1.Account.Role role = 2;
  reserved 3; // Removed profile_status: registration completion is not OTP pending.
  optional string cid = 4;
  optional string did = 5;
  string status = 6;
  string otp_id = 7;
  string expires_at = 8;
  optional string mock_code = 9;
  reserved 10, 11, 12; // Registration does not issue a session.
}

message LoginRequest {
  reserved 1; // Former phone login; do not reuse its wire tag.
  string password = 2;
  string email = 3;
}

message Session {
  string access_token = 1;
  reserved 2, 3; // Omit token type and expiry from the public login response.
  cab.common.v1.Account account = 4;
}

message AccountAccessRequest {
  string account_id = 1;
}

message AccountAccess {
  string account_id = 1;
  cab.common.v1.Account.Role role = 2;
  cab.common.v1.Account.Status status = 3;
}

service AuthService {
  // Allowed peer: gateway. Errors use gRPC status + cab-error-code trailing metadata.
  rpc RequestOtp (RequestOtpRequest) returns (OtpChallenge);
  // Allowed peer: gateway. Errors use gRPC status + cab-error-code trailing metadata.
  rpc VerifyOtp (VerifyOtpRequest) returns (OtpVerification);
  // Allowed peer: gateway. Errors use gRPC status + cab-error-code trailing metadata.
  rpc Register (RegisterRequest) returns (Registration);
  // Allowed peer: gateway. Errors use gRPC status + cab-error-code trailing metadata.
  rpc Login (LoginRequest) returns (Session);
  // Allowed peer: gateway. Errors use gRPC status + cab-error-code trailing metadata.
  rpc GetIdentity (cab.common.v1.Empty) returns (cab.common.v1.Account);
  // Allowed peer: customer_service,driver_service,booking_service,trip_service,payment_service,notification_service,rating_service. Errors use gRPC status + cab-error-code trailing metadata.
  rpc GetAccountAccess (AccountAccessRequest) returns (AccountAccess);
}
