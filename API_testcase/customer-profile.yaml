openapi: 3.0.3
info:
  title: FR05 - Xem thông tin cá nhân
  description: Khách hàng xem thông tin cá nhân của mình.
  version: 1.0.0

servers:
  - url: http://localhost:8081/api/v1

tags:
  - name: CustomerProfile
    description: API cho FR05 - Xem thông tin cá nhân

paths:
  /customer-profiles:
    get:
      tags: [CustomerProfile]
      summary: Lấy danh sách customer-profile
      operationId: getCustomerProfiles
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerProfile'

    post:
      tags: [CustomerProfile]
      summary: Xem thông tin cá nhân
      description: Khách hàng xem thông tin cá nhân của mình.
      operationId: createCustomerProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerProfileRequest'
      responses:
        '201':
          description: Thực hiện thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
        '400':
          description: Dữ liệu không hợp lệ

  /customer-profiles/{customerId}:
    get:
      tags: [CustomerProfile]
      summary: Lấy customer-profile theo ID
      operationId: getCustomerProfileById
      parameters:
        - $ref: '#/components/parameters/CustomerProfileId'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
        '404':
          description: Không tìm thấy dữ liệu

    put:
      tags: [CustomerProfile]
      summary: Cập nhật customer-profile
      operationId: updateCustomerProfile
      parameters:
        - $ref: '#/components/parameters/CustomerProfileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerProfileRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
        '400':
          description: Dữ liệu không hợp lệ
        '404':
          description: Không tìm thấy dữ liệu

    delete:
      tags: [CustomerProfile]
      summary: Xóa customer-profile
      operationId: deleteCustomerProfile
      parameters:
        - $ref: '#/components/parameters/CustomerProfileId'
      responses:
        '204':
          description: Xóa thành công
        '404':
          description: Không tìm thấy dữ liệu

components:
  parameters:
    CustomerProfileId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
      example: CUS001

  schemas:
    CustomerProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          example: Nguyễn Văn A
        email:
          type: string
          format: email
          example: nguyenvana@example.com
        phone:
          type: string
          example: "0901234567"
        password:
          type: string
          format: password
          example: Password@123
        status:
          type: string
          example: ACTIVE

    CustomerProfile:
      allOf:
        - $ref: '#/components/schemas/CustomerProfileRequest'
        - type: object
          properties:
            customerId:
              type: string
              example: CUS001
