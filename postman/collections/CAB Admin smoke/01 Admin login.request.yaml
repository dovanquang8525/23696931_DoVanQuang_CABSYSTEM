$kind: http-request
order: 1000
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "email": "{{adminEmail}}",
      "password": "{{adminPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: pm.response.to.have.status(200);const r=pm.response.json();pm.test('Admin
      session',()=>{pm.expect(r.account.role).to.eql('ADMIN');pm.expect(r.accessToken).to.be.a('string').and.not.empty;});pm.collectionVariables.set('adminToken',r.accessToken);
