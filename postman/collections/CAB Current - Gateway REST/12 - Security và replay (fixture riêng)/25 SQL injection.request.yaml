$kind: http-request
description: Chọn từng request theo postman/README.md. Không Run toàn bộ collection. Mọi request qua Gateway; cần fixture đúng trạng thái.
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "' OR 1=1 --",
      "password": "anything"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP status', () => pm.expect(pm.response.code).to.be.oneOf([400,401]));
      const data = pm.response.json();
      pm.test('JSON response', () => pm.expect(data).to.be.an('object'));
    language: text/javascript
order: 1000
