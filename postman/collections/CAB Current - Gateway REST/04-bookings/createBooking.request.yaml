$kind: http-request
description: Chọn từng request theo postman/README.md. Không Run toàn bộ collection. Mọi request qua Gateway; cần fixture đúng trạng thái.
url: "{{baseUrl}}/api/v1/bookings"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{bookingKey}}"
body:
  type: json
  content: |-
    {
      "pickupCode": "A",
      "destinationCode": "B"
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP status', () => pm.expect(pm.response.code).to.be.oneOf([200,201]));
      const data = pm.response.json();
      pm.test('JSON response', () => pm.expect(data).to.be.an('object'));
      if (pm.response.code < 300) {
      if (data.customerId) pm.environment.set('customerId', data.customerId);
      if (data.driverId) pm.environment.set('driverId', data.driverId);
      if (data.bookingId) pm.environment.set('bookingId', data.bookingId);
      if (data.tripId) pm.environment.set('tripId', data.tripId);
      if (data.paymentId) pm.environment.set('paymentId', data.paymentId);
      if (data.notificationId) pm.environment.set('notificationId', data.notificationId);
      if (data.otpId) pm.environment.set('otpId', data.otpId);
      if (data.trip?.tripId) pm.environment.set('tripId', data.trip.tripId);
      if (data.mockCode) pm.environment.set('otpCode', data.mockCode);
      if (data.accessToken) pm.environment.set('customerToken', data.accessToken);
      if (Array.isArray(data.items) && 'createBooking' === 'listMyInvitations') { const offer = data.items.find(x => x.bookingId === pm.environment.get('bookingId') && x.status === 'PENDING'); if (offer) pm.environment.set('invitationId', offer.invitationId); }
      }
      if (pm.response.code === 201) pm.environment.set('bookingSnapshot', JSON.stringify(data));
      pm.test('BIKE ?ang t?m Driver', () => { pm.expect(data.vehicleType).to.equal('BIKE'); pm.expect(data.status).to.equal('SEARCHING'); });
    language: text/javascript
  - type: beforeRequest
    code: if (!pm.environment.get('bookingKey')) pm.environment.set('bookingKey', pm.variables.replaceIn('{{$guid}}'));
    language: text/javascript
order: 1000
