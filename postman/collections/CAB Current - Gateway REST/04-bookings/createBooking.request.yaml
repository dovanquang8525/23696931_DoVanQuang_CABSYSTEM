$kind: http-request
description: Chọn từng request theo postman/README.md. Không Run toàn bộ collection. Mọi request qua Gateway; cần fixture đúng trạng thái.
url: "{{baseUrl}}/api/v1/bookings"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{bookingKey}}"
body:
  type: json
  content: |-
    {
      "pickup": {"latitude": 10.8, "longitude": 106.7},
      "destination": {"latitude": 10.81, "longitude": 106.71}
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP status', () => pm.expect(pm.response.code).to.be.oneOf([200,201]));
      const data = pm.response.json();
      pm.test('JSON response', () => pm.expect(data).to.be.an('object'));
      if (pm.response.code < 300) {
      if (data.cid) pm.environment.set('cid', data.cid);
      if (data.did) pm.environment.set('did', data.did);
      if (data.bid) pm.environment.set('bid', data.bid);
      if (data.tid) pm.environment.set('tid', data.tid);
      if (data.pid) pm.environment.set('pid', data.pid);
      if (data.nid) pm.environment.set('nid', data.nid);
      if (data.oid) pm.environment.set('oid', data.oid);
      if (data.trip?.tid) pm.environment.set('tid', data.trip.tid);
      if (data.mockCode) pm.environment.set('otpCode', data.mockCode);
      if (data.accessToken) pm.environment.set('customerToken', data.accessToken);
      if (Array.isArray(data.items) && 'createBooking' === 'listMyInvitations') { const offer = data.items.find(x => x.bid === pm.environment.get('bid') && x.status === 'PENDING'); if (offer) pm.environment.set('iid', offer.iid); }
      }
      if (pm.response.code === 201) pm.environment.set('bookingSnapshot', JSON.stringify(data));
      pm.test('BIKE ?ang t?m Driver', () => { pm.expect(data.vehicleType).to.equal('BIKE'); pm.expect(data.status).to.equal('SEARCHING'); });
    language: text/javascript
  - type: beforeRequest
    code: if (!pm.environment.get('bookingKey')) pm.environment.set('bookingKey', pm.variables.replaceIn('{{$guid}}'));
    language: text/javascript
order: 1000
