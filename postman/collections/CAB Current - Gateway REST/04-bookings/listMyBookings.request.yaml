$kind: http-request
description: Chọn từng request theo postman/README.md. Không Run toàn bộ collection. Mọi request qua Gateway; cần fixture đúng trạng thái.
url: "{{baseUrl}}/api/v1/bookings?page=1&limit=2"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP status', () => pm.expect(pm.response.code).to.be.oneOf([200]));
      const data = pm.response.json();
      pm.test('Booking Driver snapshot stays public', () => {
        if (pm.response.code !== 200) return;
        for (const item of data.items) if (item.driver) {
          pm.expect(item.driver.name).to.be.a('string').and.not.empty;
          pm.expect(item.driver.did).to.eql(item.did);
          pm.expect(item.driver).not.to.have.property('email');
          pm.expect(item.driver).not.to.have.property('licenseNumber');
        }
      });
      pm.test('JSON response', () => pm.expect(data).to.be.an('object'));
      if (pm.response.code < 300) {
      if (data.cid) pm.environment.set('cid', data.cid);
      if (data.did) pm.environment.set('did', data.did);
      if (data.bid) pm.environment.set('bid', data.bid);
      if (data.tid) pm.environment.set('tid', data.tid);
      if (data.pid) pm.environment.set('pid', data.pid);
      if (data.nid) pm.environment.set('nid', data.nid);
      if (data.oid) pm.environment.set('oid', data.oid);
      if (data.trip?.tid) pm.environment.set('tid', data.trip.tid);
      if (data.mockCode) pm.environment.set('otpCode', data.mockCode);
      if (data.accessToken) pm.environment.set('customerToken', data.accessToken);
      if (Array.isArray(data.items) && 'listMyBookings' === 'listMyInvitations') { const offer = data.items.find(x => x.bid === pm.environment.get('bid') && x.status === 'PENDING'); if (offer) pm.environment.set('iid', offer.iid); }
      }
    language: text/javascript
order: 2000
