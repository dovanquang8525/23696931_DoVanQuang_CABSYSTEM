$kind: http-request
name: cancelBooking | Xác nhận hủy Booking/Trip hợp lệ
description: |-
  Source: docs/api/04-bookings.yaml | operationId: cancelBooking

  Kiểm lại quyền/trạng thái. Lặp cùng lý do/confirmed trả kết quả hủy đã lưu; đổi lý do sau hủy 409. Assignment chưa rõ 409/503; IN_PROGRESS không hủy. Hủy sau phân công do Trip CAS quyết định.
url: "{{baseUrl}}{{apiPrefix}}/bookings/{{bookingId}}/cancellation"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "Change of plan",
      "confirmed": true
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const authReference = "{{customerToken}}";
      const needed = [pm.request.url.toString(), pm.request.body ? pm.request.body.raw : '', authReference];
      const keys = new Set(needed.join(' ').match(/\{\{[A-Za-z][A-Za-z0-9_]*\}\}/g) || []);
      for (const token of keys) {
        const key = token.slice(2,-2);
        if (!pm.variables.get(key)) throw new Error('Set local environment variable: ' + key);
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      const expected = [200];
      pm.test('HTTP status matches scenario', () => pm.expect(pm.response.code).to.be.oneOf(expected));
      pm.test('JSON content type', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.match(/application\/json/i));
      const body = pm.response.json();
      const schemas = {"200": {"type": "object", "additionalProperties": false, "properties": {"bookingId": {"type": "string", "minLength": 24, "maxLength": 24, "pattern": "^[0-9a-f]{24}$", "example": "000000000000000000000001"}, "tripId": {"type": "string", "minLength": 24, "maxLength": 24, "pattern": "^[0-9a-f]{24}$", "example": "000000000000000000000001"}, "status": {"type": "string", "enum": ["CANCELED"]}, "reason": {"type": "string", "minLength": 1, "maxLength": 300, "pattern": "^[^<>]*$", "description": "Văn bản thuần; trim trước kiểm tra. Demo từ chối dấu < > để không nhận HTML/script; khi hiển thị vẫn escape theo ngữ cảnh."}, "feeAmount": {"type": "integer", "minimum": 0, "maximum": 0}, "canceledAt": {"type": "string", "format": "date-time", "example": "2026-10-27T00:00:00Z"}}, "required": ["bookingId", "status", "reason", "feeAmount", "canceledAt"]}};
      if (schemas[pm.response.code]) pm.test('Response matches API schema', () => pm.response.to.have.jsonSchema(schemas[pm.response.code]));
      if (expected.includes(pm.response.code) && pm.response.code < 300) {
        for (const key of ['customerId','driverId','bookingId','tripId','paymentId','invitationId','notificationId','reviewId','otpId']) {
          if (body[key]) pm.environment.set(key, body[key]);
        }
        if (body.booking) {
          pm.environment.set('bookingId', body.booking.bookingId);
          if (body.booking.tripId) pm.environment.set('tripId', body.booking.tripId);
        }
        pm.test('Business state CANCELED', () => pm.expect(body.status).to.eql('CANCELED'));
      }
    language: text/javascript
order: 5000
