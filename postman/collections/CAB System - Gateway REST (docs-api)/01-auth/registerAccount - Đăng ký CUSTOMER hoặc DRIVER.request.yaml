$kind: http-request
name: registerAccount | Đăng ký CUSTOMER hoặc DRIVER
description: |-
  Source: docs/api/01-auth.yaml | operationId: registerAccount

  DRIVER bắt buộc otpId đã verified, chưa dùng. CUSTOMER không gửi otpId. ADMIN bị từ chối. Auth lưu Account/OTP/outbox cục bộ; profile tạo qua event, phản hồi profileStatus=PENDING, khi khỏe mục tiêu 5 giây.
url: "{{baseUrl}}{{apiPrefix}}/auth/register"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "{{customerPhone}}",
      "password": "{{customerPassword}}",
      "fullName": "Demo Customer",
      "role": "CUSTOMER"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const authReference = "";
      const needed = [pm.request.url.toString(), pm.request.body ? pm.request.body.raw : '', authReference];
      const keys = new Set(needed.join(' ').match(/\{\{[A-Za-z][A-Za-z0-9_]*\}\}/g) || []);
      for (const token of keys) {
        const key = token.slice(2,-2);
        if (!pm.variables.get(key)) throw new Error('Set local environment variable: ' + key);
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      const expected = [201];
      pm.test('HTTP status matches scenario', () => pm.expect(pm.response.code).to.be.oneOf(expected));
      pm.test('JSON content type', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.match(/application\/json/i));
      const body = pm.response.json();
      const schemas = {"201": {"type": "object", "additionalProperties": false, "properties": {"accountId": {"type": "string", "minLength": 24, "maxLength": 24, "pattern": "^[0-9a-f]{24}$", "example": "000000000000000000000001"}, "role": {"type": "string", "enum": ["CUSTOMER", "DRIVER"]}, "profileStatus": {"type": "string", "enum": ["PENDING"]}}, "required": ["accountId", "role", "profileStatus"]}};
      if (schemas[pm.response.code]) pm.test('Response matches API schema', () => pm.response.to.have.jsonSchema(schemas[pm.response.code]));
      if (expected.includes(pm.response.code) && pm.response.code < 300) {
        for (const key of ['customerId','driverId','bookingId','tripId','paymentId','invitationId','notificationId','reviewId','otpId']) {
          if (body[key]) pm.environment.set(key, body[key]);
        }
        if (body.booking) {
          pm.environment.set('bookingId', body.booking.bookingId);
          if (body.booking.tripId) pm.environment.set('tripId', body.booking.tripId);
        }
      }
    language: text/javascript
order: 3000
