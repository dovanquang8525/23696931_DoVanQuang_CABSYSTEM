$kind: http-request
name: loginAdmin | Seeded account; no public admin registration
description: |-
  Source: docs/api/01-auth.yaml | operationId: loginAccount

  Phone/password, Account ACTIVE. 10 request/phút/IP. Sai credential 401 không tiết lộ tài khoản tồn tại. JWT 60 phút.
url: "{{baseUrl}}{{apiPrefix}}/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "{{adminPhone}}",
      "password": "{{adminPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const authReference = "";
      const needed = [pm.request.url.toString(), pm.request.body ? pm.request.body.raw : '', authReference];
      const keys = new Set(needed.join(' ').match(/\{\{[A-Za-z][A-Za-z0-9_]*\}\}/g) || []);
      for (const token of keys) {
        const key = token.slice(2,-2);
        if (!pm.variables.get(key)) throw new Error('Set local environment variable: ' + key);
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      const expected = [200];
      pm.test('HTTP status matches scenario', () => pm.expect(pm.response.code).to.be.oneOf(expected));
      pm.test('JSON content type', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.match(/application\/json/i));
      const body = pm.response.json();
      const schemas = {"200": {"type": "object", "additionalProperties": false, "properties": {"accessToken": {"type": "string", "minLength": 1, "maxLength": 4096}, "tokenType": {"type": "string", "enum": ["Bearer"]}, "expiresAt": {"type": "string", "format": "date-time", "example": "2026-10-27T00:00:00Z"}, "account": {"type": "object", "additionalProperties": false, "properties": {"accountId": {"type": "string", "minLength": 24, "maxLength": 24, "pattern": "^[0-9a-f]{24}$", "example": "000000000000000000000001"}, "phone": {"type": "string", "minLength": 1, "example": "0900000001"}, "role": {"type": "string", "enum": ["CUSTOMER", "DRIVER", "ADMIN"]}, "status": {"type": "string", "enum": ["ACTIVE", "DISABLED"]}}, "required": ["accountId", "phone", "role", "status"]}}, "required": ["accessToken", "tokenType", "expiresAt", "account"]}};
      if (schemas[pm.response.code]) pm.test('Response matches API schema', () => pm.response.to.have.jsonSchema(schemas[pm.response.code]));
      if (expected.includes(pm.response.code) && pm.response.code < 300) {
        for (const key of ['customerId','driverId','bookingId','tripId','paymentId','invitationId','notificationId','reviewId','otpId']) {
          if (body[key]) pm.environment.set(key, body[key]);
        }
        if (body.booking) {
          pm.environment.set('bookingId', body.booking.bookingId);
          if (body.booking.tripId) pm.environment.set('tripId', body.booking.tripId);
        }
        pm.test('Login role is ADMIN', () => pm.expect(body.account.role).to.eql('ADMIN'));
        if (body.account.role === 'ADMIN') pm.environment.set('adminToken', body.accessToken);
      }
    language: text/javascript
order: 8000
