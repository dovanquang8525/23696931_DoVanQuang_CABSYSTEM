$kind: http-request
name: listMyNotifications | Tra cứu thông báo nội bộ của mình
description: |-
  Source: docs/api/08-notifications.yaml | operationId: listMyNotifications

  Tra cứu thông báo nội bộ của mình
url: "{{baseUrl}}{{apiPrefix}}/notifications?page={{page}}&limit={{limit}}"
method: GET
headers:
  Accept: application/json
queryParams:
  page: "{{page}}"
  limit: "{{limit}}"
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const authReference = "{{customerToken}}";
      const needed = [pm.request.url.toString(), pm.request.body ? pm.request.body.raw : '', authReference];
      const keys = new Set(needed.join(' ').match(/\{\{[A-Za-z][A-Za-z0-9_]*\}\}/g) || []);
      for (const token of keys) {
        const key = token.slice(2,-2);
        if (!pm.variables.get(key)) throw new Error('Set local environment variable: ' + key);
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      const expected = [200];
      pm.test('HTTP status matches scenario', () => pm.expect(pm.response.code).to.be.oneOf(expected));
      pm.test('JSON content type', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.match(/application\/json/i));
      const body = pm.response.json();
      const schemas = {"200": {"type": "object", "additionalProperties": false, "properties": {"items": {"type": "array", "items": {"type": "object", "additionalProperties": false, "properties": {"notificationId": {"type": "string", "minLength": 24, "maxLength": 24, "pattern": "^[0-9a-f]{24}$", "example": "000000000000000000000001"}, "recipientAccountId": {"type": "string", "minLength": 24, "maxLength": 24, "pattern": "^[0-9a-f]{24}$", "example": "000000000000000000000001"}, "eventId": {"type": "string", "minLength": 1, "maxLength": 128}, "type": {"type": "string", "enum": ["account.registered", "driver.approval_changed", "booking.created", "booking.invitation_created", "booking.assigned", "booking.canceled", "booking.no_driver", "trip.arrived", "trip.completed", "trip.canceled", "payment.completed", "payment.failed"]}, "content": {"type": "string", "minLength": 1, "maxLength": 1000, "pattern": "^[^<>]*$", "description": "Văn bản thuần; trim trước kiểm tra. Demo từ chối dấu < > để không nhận HTML/script; khi hiển thị vẫn escape theo ngữ cảnh."}, "relatedEntityType": {"type": "string", "enum": ["BOOKING", "TRIP", "PAYMENT", "DRIVER"]}, "relatedEntityId": {"type": "string", "minLength": 24, "maxLength": 24, "pattern": "^[0-9a-f]{24}$", "example": "000000000000000000000001"}, "occurredAt": {"type": "string", "format": "date-time", "example": "2026-10-27T00:00:00Z"}, "createdAt": {"type": "string", "format": "date-time", "example": "2026-10-27T00:00:00Z"}}, "required": ["notificationId", "recipientAccountId", "eventId", "type", "content", "relatedEntityType", "relatedEntityId", "occurredAt", "createdAt"]}}, "page": {"type": "integer", "minimum": 1}, "limit": {"type": "integer", "minimum": 1, "maximum": 50}, "totalItems": {"type": "integer", "minimum": 0, "maximum": 1000000000000}}, "required": ["items", "page", "limit", "totalItems"]}};
      if (schemas[pm.response.code]) pm.test('Response matches API schema', () => pm.response.to.have.jsonSchema(schemas[pm.response.code]));
      if (expected.includes(pm.response.code) && pm.response.code < 300) {
        for (const key of ['customerId','driverId','bookingId','tripId','paymentId','invitationId','notificationId','reviewId','otpId']) {
          if (body[key]) pm.environment.set(key, body[key]);
        }
        if (body.booking) {
          pm.environment.set('bookingId', body.booking.bookingId);
          if (body.booking.tripId) pm.environment.set('tripId', body.booking.tripId);
        }
        if (body.items.length) pm.environment.set('notificationId', body.items[0].notificationId);
      }
    language: text/javascript
order: 1000
