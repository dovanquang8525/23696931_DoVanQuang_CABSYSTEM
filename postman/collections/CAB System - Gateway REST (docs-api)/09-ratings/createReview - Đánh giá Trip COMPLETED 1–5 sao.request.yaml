$kind: http-request
name: createReview | Đánh giá Trip COMPLETED 1–5 sao
description: |-
  Source: docs/api/09-ratings.yaml | operationId: createReview

  Đúng Customer của Trip COMPLETED; một Review/Trip, duplicate 409. Không cần Payment COMPLETED; comment không HTML, tối đa 500 ký tự.
url: "{{baseUrl}}{{apiPrefix}}/trips/{{tripId}}/reviews"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "rating": 5,
      "comment": "Good trip"
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const authReference = "{{customerToken}}";
      const needed = [pm.request.url.toString(), pm.request.body ? pm.request.body.raw : '', authReference];
      const keys = new Set(needed.join(' ').match(/\{\{[A-Za-z][A-Za-z0-9_]*\}\}/g) || []);
      for (const token of keys) {
        const key = token.slice(2,-2);
        if (!pm.variables.get(key)) throw new Error('Set local environment variable: ' + key);
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      const expected = [201];
      pm.test('HTTP status matches scenario', () => pm.expect(pm.response.code).to.be.oneOf(expected));
      pm.test('JSON content type', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.match(/application\/json/i));
      const body = pm.response.json();
      const schemas = {"201": {"type": "object", "additionalProperties": false, "properties": {"reviewId": {"type": "string", "minLength": 24, "maxLength": 24, "pattern": "^[0-9a-f]{24}$", "example": "000000000000000000000001"}, "tripId": {"type": "string", "minLength": 24, "maxLength": 24, "pattern": "^[0-9a-f]{24}$", "example": "000000000000000000000001"}, "customerId": {"type": "string", "minLength": 24, "maxLength": 24, "pattern": "^[0-9a-f]{24}$", "example": "000000000000000000000001"}, "driverId": {"type": "string", "minLength": 24, "maxLength": 24, "pattern": "^[0-9a-f]{24}$", "example": "000000000000000000000001"}, "rating": {"type": "integer", "minimum": 1, "maximum": 5}, "comment": {"type": "string", "minLength": 0, "maxLength": 500, "pattern": "^[^<>]*$"}, "createdAt": {"type": "string", "format": "date-time", "example": "2026-10-27T00:00:00Z"}}, "required": ["reviewId", "tripId", "customerId", "driverId", "rating", "createdAt"]}};
      if (schemas[pm.response.code]) pm.test('Response matches API schema', () => pm.response.to.have.jsonSchema(schemas[pm.response.code]));
      if (expected.includes(pm.response.code) && pm.response.code < 300) {
        for (const key of ['customerId','driverId','bookingId','tripId','paymentId','invitationId','notificationId','reviewId','otpId']) {
          if (body[key]) pm.environment.set(key, body[key]);
        }
        if (body.booking) {
          pm.environment.set('bookingId', body.booking.bookingId);
          if (body.booking.tripId) pm.environment.set('tripId', body.booking.tripId);
        }
      }
    language: text/javascript
order: 1000
