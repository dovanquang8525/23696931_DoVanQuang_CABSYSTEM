$kind: http-request
name: decideDriverApproval | ADMIN duyệt hoặc từ chối hồ sơ PENDING
description: |-
  Source: docs/api/03-drivers.yaml | operationId: decideDriverApproval

  REJECTED cần reason trim 1–300; APPROVED không nhận reason. Ghi người/thời điểm và event driver.approval_changed; không tự online.
url: "{{baseUrl}}{{apiPrefix}}/admin/drivers/{{driverId}}/approval-decisions"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "decision": "APPROVED"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const authReference = "{{adminToken}}";
      const needed = [pm.request.url.toString(), pm.request.body ? pm.request.body.raw : '', authReference];
      const keys = new Set(needed.join(' ').match(/\{\{[A-Za-z][A-Za-z0-9_]*\}\}/g) || []);
      for (const token of keys) {
        const key = token.slice(2,-2);
        if (!pm.variables.get(key)) throw new Error('Set local environment variable: ' + key);
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      const expected = [200];
      pm.test('HTTP status matches scenario', () => pm.expect(pm.response.code).to.be.oneOf(expected));
      pm.test('JSON content type', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.match(/application\/json/i));
      const body = pm.response.json();
      const schemas = {"200": {"type": "object", "additionalProperties": false, "properties": {"driverId": {"type": "string", "minLength": 24, "maxLength": 24, "pattern": "^[0-9a-f]{24}$", "example": "000000000000000000000001"}, "accountId": {"type": "string", "minLength": 24, "maxLength": 24, "pattern": "^[0-9a-f]{24}$", "example": "000000000000000000000001"}, "fullName": {"type": "string", "minLength": 1, "maxLength": 100, "pattern": "^[^<>]*$", "description": "Văn bản thuần; trim trước kiểm tra. Demo từ chối dấu < > để không nhận HTML/script; khi hiển thị vẫn escape theo ngữ cảnh."}, "email": {"type": "string", "minLength": 1, "maxLength": 254, "format": "email"}, "licenseNumber": {"type": "string", "minLength": 1, "maxLength": 50, "description": "Chỉ owner/ADMIN; DB lưu licenseNumberEncrypted, không plaintext."}, "approvalStatus": {"type": "string", "enum": ["DRAFT", "PENDING", "APPROVED", "REJECTED"]}, "isOnline": {"type": "boolean"}, "location": {"type": "object", "additionalProperties": false, "properties": {"latitude": {"type": "number", "minimum": -90, "maximum": 90}, "longitude": {"type": "number", "minimum": -180, "maximum": 180}, "updatedAt": {"type": "string", "format": "date-time", "example": "2026-10-27T00:00:00Z"}}, "required": ["latitude", "longitude", "updatedAt"]}, "vehicle": {"type": "object", "additionalProperties": false, "properties": {"vehicleId": {"type": "string", "minLength": 24, "maxLength": 24, "pattern": "^[0-9a-f]{24}$", "example": "000000000000000000000001"}, "driverId": {"type": "string", "minLength": 24, "maxLength": 24, "pattern": "^[0-9a-f]{24}$", "example": "000000000000000000000001"}, "plateNumber": {"type": "string", "minLength": 1, "maxLength": 20, "pattern": "^[^<>]*$", "description": "Văn bản thuần; trim trước kiểm tra. Demo từ chối dấu < > để không nhận HTML/script; khi hiển thị vẫn escape theo ngữ cảnh."}, "vehicleType": {"type": "string", "enum": ["BIKE"]}, "model": {"type": "string", "minLength": 1, "maxLength": 100, "pattern": "^[^<>]*$", "description": "Văn bản thuần; trim trước kiểm tra. Demo từ chối dấu < > để không nhận HTML/script; khi hiển thị vẫn escape theo ngữ cảnh."}, "color": {"type": "string", "minLength": 1, "maxLength": 30, "pattern": "^[^<>]*$", "description": "Văn bản thuần; trim trước kiểm tra. Demo từ chối dấu < > để không nhận HTML/script; khi hiển thị vẫn escape theo ngữ cảnh."}, "isActive": {"type": "boolean", "enum": [true]}}, "required": ["vehicleId", "driverId", "plateNumber", "vehicleType", "model", "color", "isActive"]}, "activeTripId": {"type": "string", "minLength": 24, "maxLength": 24, "pattern": "^[0-9a-f]{24}$", "example": "000000000000000000000001"}, "rejectionReason": {"type": "string", "minLength": 1, "maxLength": 300, "pattern": "^[^<>]*$", "description": "Văn bản thuần; trim trước kiểm tra. Demo từ chối dấu < > để không nhận HTML/script; khi hiển thị vẫn escape theo ngữ cảnh."}, "submittedAt": {"type": "string", "format": "date-time", "example": "2026-10-27T00:00:00Z"}, "reviewedAt": {"type": "string", "format": "date-time", "example": "2026-10-27T00:00:00Z"}}, "required": ["driverId", "accountId", "fullName", "approvalStatus", "isOnline"]}};
      if (schemas[pm.response.code]) pm.test('Response matches API schema', () => pm.response.to.have.jsonSchema(schemas[pm.response.code]));
      if (expected.includes(pm.response.code) && pm.response.code < 300) {
        for (const key of ['customerId','driverId','bookingId','tripId','paymentId','invitationId','notificationId','reviewId','otpId']) {
          if (body[key]) pm.environment.set(key, body[key]);
        }
        if (body.booking) {
          pm.environment.set('bookingId', body.booking.bookingId);
          if (body.booking.tripId) pm.environment.set('tripId', body.booking.tripId);
        }
      }
    language: text/javascript
order: 11000
