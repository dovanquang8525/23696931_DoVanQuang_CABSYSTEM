$kind: http-request
name: listNearbyDrivers | Tìm Driver đủ điều kiện trong 1 km
description: |-
  Source: docs/api/03-drivers.yaml | operationId: listNearbyDrivers

  Chỉ ACTIVE/APPROVED/online/BIKE/không bận/giữ chỗ/vị trí <=120 giây. Sort distanceKm rồi driverId tăng; lỗi Auth không giả danh sách không có Driver.
url: "{{baseUrl}}{{apiPrefix}}/drivers/nearby?latitude={{latitude}}&longitude={{longitude}}&page={{page}}&limit={{limit}}"
method: GET
headers:
  Accept: application/json
queryParams:
  latitude: "{{latitude}}"
  longitude: "{{longitude}}"
  page: "{{page}}"
  limit: "{{limit}}"
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: beforeRequest
    code: |-
      const authReference = "{{customerToken}}";
      const needed = [pm.request.url.toString(), pm.request.body ? pm.request.body.raw : '', authReference];
      const keys = new Set(needed.join(' ').match(/\{\{[A-Za-z][A-Za-z0-9_]*\}\}/g) || []);
      for (const token of keys) {
        const key = token.slice(2,-2);
        if (!pm.variables.get(key)) throw new Error('Set local environment variable: ' + key);
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      const expected = [200];
      pm.test('HTTP status matches scenario', () => pm.expect(pm.response.code).to.be.oneOf(expected));
      pm.test('JSON content type', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.match(/application\/json/i));
      const body = pm.response.json();
      const schemas = {"200": {"type": "object", "additionalProperties": false, "properties": {"items": {"type": "array", "items": {"type": "object", "additionalProperties": false, "properties": {"driver": {"type": "object", "additionalProperties": false, "properties": {"driverId": {"type": "string", "minLength": 24, "maxLength": 24, "pattern": "^[0-9a-f]{24}$", "example": "000000000000000000000001"}, "fullName": {"type": "string", "minLength": 1, "maxLength": 100, "pattern": "^[^<>]*$", "description": "Văn bản thuần; trim trước kiểm tra. Demo từ chối dấu < > để không nhận HTML/script; khi hiển thị vẫn escape theo ngữ cảnh."}, "vehicle": {"type": "object", "additionalProperties": false, "properties": {"vehicleId": {"type": "string", "minLength": 24, "maxLength": 24, "pattern": "^[0-9a-f]{24}$", "example": "000000000000000000000001"}, "driverId": {"type": "string", "minLength": 24, "maxLength": 24, "pattern": "^[0-9a-f]{24}$", "example": "000000000000000000000001"}, "plateNumber": {"type": "string", "minLength": 1, "maxLength": 20, "pattern": "^[^<>]*$", "description": "Văn bản thuần; trim trước kiểm tra. Demo từ chối dấu < > để không nhận HTML/script; khi hiển thị vẫn escape theo ngữ cảnh."}, "vehicleType": {"type": "string", "enum": ["BIKE"]}, "model": {"type": "string", "minLength": 1, "maxLength": 100, "pattern": "^[^<>]*$", "description": "Văn bản thuần; trim trước kiểm tra. Demo từ chối dấu < > để không nhận HTML/script; khi hiển thị vẫn escape theo ngữ cảnh."}, "color": {"type": "string", "minLength": 1, "maxLength": 30, "pattern": "^[^<>]*$", "description": "Văn bản thuần; trim trước kiểm tra. Demo từ chối dấu < > để không nhận HTML/script; khi hiển thị vẫn escape theo ngữ cảnh."}, "isActive": {"type": "boolean", "enum": [true]}}, "required": ["vehicleId", "driverId", "plateNumber", "vehicleType", "model", "color", "isActive"]}}, "required": ["driverId", "fullName", "vehicle"]}, "distanceKm": {"type": "number", "minimum": 0, "maximum": 1}, "location": {"type": "object", "additionalProperties": false, "properties": {"latitude": {"type": "number", "minimum": -90, "maximum": 90}, "longitude": {"type": "number", "minimum": -180, "maximum": 180}, "updatedAt": {"type": "string", "format": "date-time", "example": "2026-10-27T00:00:00Z"}}, "required": ["latitude", "longitude", "updatedAt"]}}, "required": ["driver", "distanceKm", "location"]}}, "page": {"type": "integer", "minimum": 1}, "limit": {"type": "integer", "minimum": 1, "maximum": 50}, "totalItems": {"type": "integer", "minimum": 0, "maximum": 1000000000000}}, "required": ["items", "page", "limit", "totalItems"]}};
      if (schemas[pm.response.code]) pm.test('Response matches API schema', () => pm.response.to.have.jsonSchema(schemas[pm.response.code]));
      if (expected.includes(pm.response.code) && pm.response.code < 300) {
        for (const key of ['customerId','driverId','bookingId','tripId','paymentId','invitationId','notificationId','reviewId','otpId']) {
          if (body[key]) pm.environment.set(key, body[key]);
        }
        if (body.booking) {
          pm.environment.set('bookingId', body.booking.bookingId);
          if (body.booking.tripId) pm.environment.set('tripId', body.booking.tripId);
        }
      }
    language: text/javascript
order: 9000
