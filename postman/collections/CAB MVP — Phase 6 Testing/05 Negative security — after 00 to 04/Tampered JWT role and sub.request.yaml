$kind: http-request
description: |-
  AC: AC95
  Xem định danh Account
url: "{{base_url}}/api/v1/auth/me"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{tampered_token}}"
scripts:
  - type: beforeRequest
    code: |-
      (function () {
      const prereq = ["customer_token"];
      const absent=prereq.filter(k=>!String(pm.environment.get(k)||'').trim());
      if(absent.length){pm.execution.skipRequest();throw new Error('BLOCKED: thiếu tiên quyết '+absent.join(', '));}

      const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
      function decode64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');let bits=0,n=0,out='';for(const c of s){if(c==='=')break;const v=alphabet.indexOf(c);if(v<0)throw new Error('Invalid base64');bits=(bits<<6)|v;n+=6;if(n>=8){n-=8;out+=String.fromCharCode((bits>>n)&255);}}return out;}
      function encode64(s){let bits=0,n=0,out='';for(let i=0;i<s.length;i++){bits=(bits<<8)|s.charCodeAt(i);n+=8;while(n>=6){n-=6;out+=alphabet[(bits>>n)&63];}}if(n>0)out+=alphabet[(bits<<(6-n))&63];return out.replace(/\+/g,'-').replace(/\//g,'_');}
      const original=pm.environment.get('customer_token');if(!original)throw new Error('BLOCKED: cần customer_token hợp lệ');
      const parts=original.split('.');if(parts.length!==3)throw new Error('BLOCKED: token không đúng JWT');
      const payload=JSON.parse(decode64(parts[1]));payload.role='ADMIN';payload.sub='000000000000000000000999';
      pm.environment.set('tampered_token',parts[0]+'.'+encode64(JSON.stringify(payload))+'.'+parts[2]);

      const required = ["base_url", "tampered_token"];
      const missing = required.filter(k => !String(pm.environment.get(k) || '').trim());
      if (missing.length) { pm.execution.skipRequest(); throw new Error('BLOCKED: thiếu environment: ' + missing.join(', ')); }
      })();
    language: text/javascript
  - type: afterResponse
    code: |-
      (function () {
      const expected = 401;
      pm.test('HTTP đúng kỳ vọng: '+expected, function () { pm.expect(pm.response.code).to.eql(expected); });
      pm.test('Phản hồi JSON', function () { pm.expect((pm.response.headers.get('Content-Type') || '').toLowerCase()).to.include('application/json'); });
      let j;
      try { j=pm.response.json(); } catch (e) { throw new Error('Response không phải JSON hợp lệ'); }
      function noSecrets(v) {
        if (!v || typeof v !== 'object') return;
        Object.keys(v).forEach(k => { if (['passwordHash','codeHash','secret','signingKey','licenseNumberEncrypted','stack','stackTrace'].includes(k)) throw new Error('Lộ field nhạy cảm: '+k); noSecrets(v[k]); });
      }
      pm.test('Không lộ hash/key/stack trong JSON', function () { noSecrets(j); });
      if (pm.response.code !== expected) { pm.execution.setNextRequest(null); return; }
      if (expected>=400) pm.test('Error envelope',function(){ ['code','message','requestId'].forEach(k=>pm.expect(j[k]).to.be.a('string').and.not.empty); });
      })();
    language: text/javascript
order: 2000
