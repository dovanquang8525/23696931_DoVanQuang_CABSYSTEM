$kind: http-request
url: "{{baseUrl}}/api/v1/customers/me"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "  Updated Customer  ",
      "email": "postman@example.test"
    }
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      pm.test('Name trimmed',()=>pm.expect(pm.response.json().fullName).to.eql('Updated Customer'));
    language: text/javascript
order: 6000
