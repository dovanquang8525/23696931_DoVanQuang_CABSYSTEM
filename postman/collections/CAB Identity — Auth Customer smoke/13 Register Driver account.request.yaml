$kind: http-request
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "{{driver_phone}}",
      "password": "{{fixture_password}}",
      "fullName": "Postman Driver",
      "role": "DRIVER",
      "otpId": "{{otpId}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', function () { pm.response.to.have.status(201); });
      if (pm.response.code===201) pm.variables.set('driver_account_id',pm.response.json().accountId);
    language: text/javascript
order: 13000
