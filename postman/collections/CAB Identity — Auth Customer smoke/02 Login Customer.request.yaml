$kind: http-request
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "{{customer_phone}}",
      "password": "{{fixture_password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      if (pm.response.code === 200) { const r=pm.response.json(); pm.variables.set('customer_token',r.accessToken); pm.test('Separate account identity',()=>pm.expect(r.account.accountId).to.eql(pm.variables.get('customer_account_id'))); }
    language: text/javascript
order: 2000
