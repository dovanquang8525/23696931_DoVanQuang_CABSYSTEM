$kind: http-request
url: "{{baseUrl}}/api/v1/customers/me"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "role": "ADMIN"
    }
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 400', function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 7000
