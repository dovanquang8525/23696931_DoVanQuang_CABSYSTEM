$kind: http-request
url: "{{baseUrl}}/api/v1/auth/otp-challenges"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "{{driver_phone}}",
      "purpose": "DRIVER_REGISTRATION"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', function () { pm.response.to.have.status(201); });
      if (pm.response.code===201) { const r=pm.response.json(); pm.test('Mock OTP available',()=>pm.expect(r.mockCode).to.match(/^[0-9]{6}$/)); pm.variables.set('otpId',r.otpId); pm.variables.set('otp_code',r.mockCode); }
    language: text/javascript
order: 10000
