$kind: http-request
order: 2000
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.response.to.have.status(200);
      const r=pm.response.json();
      pm.test('Compact login session',()=>{pm.expect(Object.keys(r).sort()).to.eql(['accessToken','account']);pm.expect(r.accessToken).to.be.a('string').and.not.empty;pm.expect(Object.keys(r.account).sort()).to.eql(['accountId','cid','role']);pm.expect(r.account.accountId).to.eql(pm.collectionVariables.get('customerAccountId'));});
      pm.collectionVariables.set('customerToken',r.accessToken);
body:
  type: json
  content: |-
    {
      "email": "{{registrationEmail}}",
      "password": "{{registrationPassword}}"
    }
