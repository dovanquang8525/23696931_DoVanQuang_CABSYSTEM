$kind: http-request
order: 2500
url: "{{baseUrl}}/api/v1/auth/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.response.to.have.status(200);
      pm.test('Login token works',()=>pm.expect(pm.response.json().accountId).to.eql(pm.collectionVariables.get('customerAccountId')));
