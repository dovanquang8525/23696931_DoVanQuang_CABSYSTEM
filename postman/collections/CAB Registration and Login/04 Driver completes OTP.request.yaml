$kind: http-request
order: 4000
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "email": "{{driverRegistrationEmail}}",
      "phone": "{{driverRegistrationPhone}}",
      "password": "{{registrationPassword}}",
      "plateNumber": "{{driverRegistrationPlate}}",
      "code": "{{registrationOtp}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.response.to.have.status(201);
      pm.test('Driver account created after OTP',()=>{const r=pm.response.json();pm.expect(r.role).to.eql('DRIVER');pm.expect(r.did).to.match(/^d[0-9]+$/);pm.expect(r).not.to.have.property('profileStatus');pm.collectionVariables.set('driverAccountId',r.accountId);});
