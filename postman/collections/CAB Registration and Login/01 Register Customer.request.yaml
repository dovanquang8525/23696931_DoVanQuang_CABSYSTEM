$kind: http-request
order: 1000
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "email": "{{registrationEmail}}",
      "phone": "{{registrationPhone}}",
      "password": "{{registrationPassword}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const phone='0'+String(Math.floor(100000000+Math.random()*900000000));
      pm.collectionVariables.set('registrationPhone',phone);
      pm.collectionVariables.set('registrationEmail',phone+'@example.test');
      pm.collectionVariables.set('registrationPassword','Cab-'+pm.variables.replaceIn('{{$randomUUID}}'));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.response.to.have.status(201);
      const r=pm.response.json();
      pm.test('Registration has only account identity',()=>{pm.expect(Object.keys(r).sort()).to.eql(['accountId','cid','role']);pm.expect(r.role).to.eql('CUSTOMER');});
      pm.collectionVariables.set('customerAccountId',r.accountId);
