openapi: 3.0.3
info:
  title: CAB MVP — Invitations
  version: 3.0.0
  description: REST interface duy nhất của API Gateway. Thiết kế theo SRS 2.0 và Bounded Context 3.0; chưa triển
    khai backend. Chỉ BIKE/MOCK_ONLINE. Các RPC nội bộ không phải REST endpoint.
servers:
- url: http://localhost:3000/api/v1
  description: Địa chỉ local mục tiêu, không xác nhận đang chạy.
security:
- BearerAuth: []
tags:
- name: Invitations
paths:
  /drivers/me/invitations:
    get:
      tags:
      - Invitations
      operationId: listMyInvitations
      summary: Xem lời mời thuộc Driver hiện tại
      description: Xem lời mời thuộc Driver hiện tại
      x-grpc: cab.booking.v1.BookingService/ListMyInvitations
      x-allowed-roles:
      - DRIVER
      x-ownership: Theo metadata caller và quy tắc nghiệp vụ; không tin ID/role tự khai.
      x-srs:
      - FR12
      - FR13
      responses:
        "200":
          description: Thành công; dữ liệu thuộc phạm vi được phép.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPage"
        "400":
          description: "INVALID_INPUT: sai kiểu, unknown field, miền giá trị hoặc thiếu dữ liệu."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "UNAUTHENTICATED: JWT thiếu/sai/hết hạn hoặc chữ ký callback sai."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "FORBIDDEN: sai role, ownership hoặc Account DISABLED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "NOT_FOUND: đối tượng không tồn tại sau khi kiểm quyền."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "CONFLICT: trạng thái, dữ liệu trùng, khóa idempotency khác payload hoặc operation đang xử lý."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "RATE_LIMITED: không thực hiện thêm thao tác nghiệp vụ."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          headers:
            Retry-After:
              description: Số giây còn lại trong cửa sổ rate limit.
              schema:
                type: integer
                minimum: 1
        "500":
          description: "INTERNAL_ERROR: không trả stack trace."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: DEPENDENCY_UNAVAILABLE hoặc PROFILE_NOT_READY; không giả kết quả nghiệp vụ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: DEADLINE_EXCEEDED; write có thể đã xảy ra, cần tra cứu cùng operation/key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: ""
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        description: ""
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - REJECTED
          - EXPIRED
          - CANCELED
        description: ""
  /invitations/{invitationId}/response:
    post:
      tags:
      - Invitations
      operationId: respondInvitation
      summary: Chấp nhận/từ chối lời mời
      description: Đúng Driver, trước expiresAt, Booking SEARCHING. ACCEPT phối hợp reservation/Trip; replay cùng
        quyết định trả kết quả đã lưu. Trái kết quả cuối/hết hạn 409. Deadline không mở phân công khác.
      x-grpc: cab.booking.v1.BookingService/RespondInvitation
      x-allowed-roles:
      - DRIVER
      x-ownership: Theo metadata caller và quy tắc nghiệp vụ; không tin ID/role tự khai.
      x-srs:
      - FR13
      - FR14
      - FR15
      - AC35
      - AC36
      - AC37
      - AC38
      responses:
        "200":
          description: Thành công; dữ liệu thuộc phạm vi được phép.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResult"
        "400":
          description: "INVALID_INPUT: sai kiểu, unknown field, miền giá trị hoặc thiếu dữ liệu."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "UNAUTHENTICATED: JWT thiếu/sai/hết hạn hoặc chữ ký callback sai."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "FORBIDDEN: sai role, ownership hoặc Account DISABLED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "NOT_FOUND: đối tượng không tồn tại sau khi kiểm quyền."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "CONFLICT: trạng thái, dữ liệu trùng, khóa idempotency khác payload hoặc operation đang xử lý."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "RATE_LIMITED: không thực hiện thêm thao tác nghiệp vụ."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          headers:
            Retry-After:
              description: Số giây còn lại trong cửa sổ rate limit.
              schema:
                type: integer
                minimum: 1
        "500":
          description: "INTERNAL_ERROR: không trả stack trace."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: DEPENDENCY_UNAVAILABLE hoặc PROFILE_NOT_READY; không giả kết quả nghiệp vụ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: DEADLINE_EXCEEDED; write có thể đã xảy ra, cần tra cứu cùng operation/key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: "000000000000000000000001"
        description: ""
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationDecision"
            examples:
              demo:
                summary: Dữ liệu giả; thay ID/OTP/timestamp theo kết quả chạy thực tế.
                value:
                  decision: ACCEPT
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT HS256; verify signature, issuer=cab-auth, audience=cab-api, exp và sub; không chỉ decode.
  schemas:
    Booking:
      type: object
      additionalProperties: false
      properties:
        bookingId: &a1
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: "000000000000000000000001"
        customerId: *a1
        vehicleType:
          type: string
          enum:
          - BIKE
        pickup:
          $ref: "#/components/schemas/Coordinates"
        destination:
          $ref: "#/components/schemas/Coordinates"
        status:
          type: string
          enum:
          - SEARCHING
          - ASSIGNED
          - COMPLETED
          - CANCELED
          - NO_DRIVER
        distanceKm:
          type: number
          exclusiveMinimum: true
          minimum: 0
        pricingSnapshot:
          $ref: "#/components/schemas/PricingSnapshot"
        tripId: *a1
        createdAt: &a2
          type: string
          format: date-time
          example: 2026-10-27T00:00:00Z
        updatedAt: *a2
      required:
      - bookingId
      - customerId
      - vehicleType
      - pickup
      - destination
      - status
      - distanceKm
      - pricingSnapshot
      - createdAt
      - updatedAt
    Coordinates:
      type: object
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      required:
      - latitude
      - longitude
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
          maxLength: 500
        requestId:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - code
      - message
      - requestId
    Invitation:
      type: object
      additionalProperties: false
      properties:
        invitationId: &a3
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: "000000000000000000000001"
        bookingId: *a3
        driverId: *a3
        pickup:
          $ref: "#/components/schemas/Coordinates"
        destination:
          $ref: "#/components/schemas/Coordinates"
        vehicleType:
          type: string
          enum:
          - BIKE
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - REJECTED
          - EXPIRED
          - CANCELED
        expiresAt: &a4
          type: string
          format: date-time
          example: 2026-10-27T00:00:00Z
        respondedAt: *a4
      required:
      - invitationId
      - bookingId
      - driverId
      - pickup
      - destination
      - vehicleType
      - status
      - expiresAt
    InvitationDecision:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum:
          - ACCEPT
          - REJECT
      required:
      - decision
    InvitationPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 50
        totalItems:
          type: integer
          minimum: 0
          maximum: 1000000000000
      required:
      - items
      - page
      - limit
      - totalItems
    InvitationResult:
      type: object
      additionalProperties: false
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        booking:
          $ref: "#/components/schemas/Booking"
        tripId:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: "000000000000000000000001"
      required:
      - invitation
      - booking
    PricingSnapshot:
      type: object
      additionalProperties: false
      properties:
        baseFare:
          type: integer
          minimum: 10000
          maximum: 10000
        ratePerKm:
          type: integer
          minimum: 5000
          maximum: 5000
        roundingUnit:
          type: integer
          minimum: 1000
          maximum: 1000
      required:
      - baseFare
      - ratePerKm
      - roundingUnit
