openapi: 3.0.3
info:
  title: CAB MVP — Auth
  version: 1.0.0
  description: REST interface duy nhất của API Gateway. Thiết kế theo SRS 2.0 và Bounded Context 3.0; chưa
    triển khai backend. Chỉ BIKE/MOCK_ONLINE. Các RPC nội bộ không phải REST endpoint.
servers:
- url: http://localhost:3000/api/v1
  description: Địa chỉ local mục tiêu, không xác nhận đang chạy.
security:
- BearerAuth: []
tags:
- name: Auth
paths:
  /auth/otp-challenges:
    post:
      tags:
      - Auth
      operationId: requestDriverOtp
      summary: Yêu cầu OTP mock đăng ký Driver
      description: 5 request/phút/IP; cách nhau 60 giây/phone. 6 số, 5 phút. mockCode chỉ ở OTP_MOCK_MODE=true;
        không SMS thật.
      x-grpc: cab.auth.v1.AuthService/RequestOtp
      x-allowed-roles: []
      x-ownership: Theo metadata caller và quy tắc nghiệp vụ; không tin ID/role tự khai.
      x-srs:
      - FR43
      - AC09
      - AC10
      responses:
        '201':
          description: Thành công; dữ liệu thuộc phạm vi được phép.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
        '400':
          description: 'INVALID_INPUT: sai kiểu, unknown field, miền giá trị hoặc thiếu dữ liệu.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'UNAUTHENTICATED: JWT thiếu/sai/hết hạn hoặc chữ ký callback sai.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'FORBIDDEN: sai role, ownership hoặc Account DISABLED.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'NOT_FOUND: đối tượng không tồn tại sau khi kiểm quyền.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'CONFLICT: trạng thái, dữ liệu trùng, khóa idempotency khác payload hoặc operation đang
            xử lý.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'RATE_LIMITED: không thực hiện thêm thao tác nghiệp vụ.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Số giây còn lại trong cửa sổ rate limit.
              schema:
                type: integer
                minimum: 1
        '500':
          description: 'INTERNAL_ERROR: không trả stack trace.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: DEPENDENCY_UNAVAILABLE hoặc PROFILE_NOT_READY; không giả kết quả nghiệp vụ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: DEADLINE_EXCEEDED; write có thể đã xảy ra, cần tra cứu cùng operation/key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOtpInput'
            examples:
              demo:
                summary: Dữ liệu giả; thay ID/OTP/timestamp theo kết quả chạy thực tế.
                value:
                  phone: 0900000002
                  purpose: DRIVER_REGISTRATION
  /auth/otp-challenges/{otpId}/verify:
    post:
      tags:
      - Auth
      operationId: verifyDriverOtp
      summary: Xác minh OTP trước khi tạo Driver Account
      description: Tối đa 5 lần sai/challenge và 10 request/phút/IP. Bằng chứng gắn otpId/phone/purpose, hết
        hiệu lực cùng expiresAt và tiêu thụ một lần tại Register.
      x-grpc: cab.auth.v1.AuthService/VerifyOtp
      x-allowed-roles: []
      x-ownership: Theo metadata caller và quy tắc nghiệp vụ; không tin ID/role tự khai.
      x-srs:
      - FR43
      - AC11
      - AC12
      responses:
        '200':
          description: Thành công; dữ liệu thuộc phạm vi được phép.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerification'
        '400':
          description: 'INVALID_INPUT: sai kiểu, unknown field, miền giá trị hoặc thiếu dữ liệu.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'UNAUTHENTICATED: JWT thiếu/sai/hết hạn hoặc chữ ký callback sai.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'FORBIDDEN: sai role, ownership hoặc Account DISABLED.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'NOT_FOUND: đối tượng không tồn tại sau khi kiểm quyền.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'CONFLICT: trạng thái, dữ liệu trùng, khóa idempotency khác payload hoặc operation đang
            xử lý.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'RATE_LIMITED: không thực hiện thêm thao tác nghiệp vụ.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Số giây còn lại trong cửa sổ rate limit.
              schema:
                type: integer
                minimum: 1
        '500':
          description: 'INTERNAL_ERROR: không trả stack trace.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: DEPENDENCY_UNAVAILABLE hoặc PROFILE_NOT_READY; không giả kết quả nghiệp vụ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: DEADLINE_EXCEEDED; write có thể đã xảy ra, cần tra cứu cùng operation/key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      parameters:
      - name: otpId
        in: path
        required: true
        schema:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: '000000000000000000000001'
        description: ''
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpInput'
            examples:
              demo:
                summary: Dữ liệu giả; thay ID/OTP/timestamp theo kết quả chạy thực tế.
                value:
                  phone: 0900000002
                  code: '123456'
  /auth/register:
    post:
