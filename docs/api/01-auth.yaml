        Auth lưu Account/OTP/outbox cục bộ; profile tạo qua event, phản hồi profileStatus=PENDING, khi khỏe
        mục tiêu 5 giây.
      x-grpc: cab.auth.v1.AuthService/Register
      x-allowed-roles: []
      x-ownership: Theo metadata caller và quy tắc nghiệp vụ; không tin ID/role tự khai.
      x-srs:
      - FR01
