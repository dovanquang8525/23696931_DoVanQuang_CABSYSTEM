          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
            examples:
              demo:
                summary: Dữ liệu giả; thay ID/OTP/timestamp theo kết quả chạy thực tế.
                value:
                  phone: 0900000001
                  password: DemoPass123
                  fullName: Demo Customer
                  role: CUSTOMER
              driver:
                summary: Driver cần otpId đã xác minh, chưa dùng.
                value:
                  phone: 0900000002
                  password: DemoPass123
                  fullName: Demo Driver
                  role: DRIVER
                  otpId: '000000000000000000000001'
  /auth/login:
