components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT HS256; verify signature, issuer=cab-auth, audience=cab-api, exp và sub; không chỉ decode.
  schemas:
    Account:
      type: object
      additionalProperties: false
      properties:
        accountId:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: '000000000000000000000001'
        phone:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^0[0-9]{9}$
          example: 0900000001
        role:
          type: string
          enum:
          - CUSTOMER
          - DRIVER
          - ADMIN
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
      required:
      - accountId
      - phone
      - role
      - status
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
          maxLength: 500
        requestId:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - code
      - message
      - requestId
    LoginInput:
      type: object
      additionalProperties: false
      properties:
        phone:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^0[0-9]{9}$
          example: 0900000001
        password:
          type: string
          minLength: 8
          maxLength: 64
          format: password
          writeOnly: true
      required:
      - phone
      - password
    OtpChallenge:
      type: object
      additionalProperties: false
      properties:
        otpId:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: '000000000000000000000001'
        expiresAt:
          type: string
          format: date-time
          example: '2026-10-27T00:00:00Z'
        mockCode:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^[0-9]{6}$
          description: Chỉ có khi OTP_MOCK_MODE=true ở demo local; không ghi log hoặc lưu plaintext.
      required:
      - otpId
      - expiresAt
    OtpVerification:
      type: object
      additionalProperties: false
      properties:
        otpId:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: '000000000000000000000001'
        verified:
          type: boolean
          enum:
          - true
        expiresAt:
          type: string
          format: date-time
          example: '2026-10-27T00:00:00Z'
      required:
      - otpId
      - verified
      - expiresAt
    RegisterInput:
      type: object
      additionalProperties: false
      properties:
        phone:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^0[0-9]{9}$
          example: 0900000001
        password:
          type: string
          minLength: 8
          maxLength: 64
          format: password
          writeOnly: true
        fullName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[^<>]*$
          description: Văn bản thuần; trim trước kiểm tra. Demo từ chối dấu < > để không nhận HTML/script;
            khi hiển thị vẫn escape theo ngữ cảnh.
        role:
          type: string
          enum:
          - CUSTOMER
          - DRIVER
        otpId:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: '000000000000000000000001'
      required:
      - phone
      - password
      - fullName
      - role
      oneOf:
      - properties:
          role:
            type: string
            enum:
            - CUSTOMER
        not:
          required:
          - otpId
      - properties:
          role:
            type: string
            enum:
            - DRIVER
        required:
        - otpId
    Registration:
      type: object
      additionalProperties: false
      properties:
        accountId:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: '000000000000000000000001'
        role:
          type: string
          enum:
          - CUSTOMER
          - DRIVER
        profileStatus:
          type: string
          enum:
          - PENDING
      required:
      - accountId
      - role
      - profileStatus
    RequestOtpInput:
      type: object
      additionalProperties: false
      properties:
        phone:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^0[0-9]{9}$
          example: 0900000001
        purpose:
          type: string
          enum:
          - DRIVER_REGISTRATION
      required:
      - phone
      - purpose
    Session:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
          minLength: 1
          maxLength: 4096
        tokenType:
          type: string
          enum:
          - Bearer
        expiresAt:
          type: string
          format: date-time
          example: '2026-10-27T00:00:00Z'
        account:
          $ref: '#/components/schemas/Account'
      required:
      - accessToken
      - tokenType
      - expiresAt
      - account
    VerifyOtpInput:
      type: object
      additionalProperties: false
      properties:
        phone:
          type: string
          minLength: 10
          maxLength: 10
          pattern: ^0[0-9]{9}$
          example: 0900000001
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^[0-9]{6}$
      required:
      - phone
      - code
