components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT HS256; verify signature, issuer=cab-auth, audience=cab-api, exp và sub; không chỉ decode.
  schemas:
    Account:
      type: object
      additionalProperties: false
      properties:
        accountId:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: "000000000000000000000001"
        phone:
          type: string
          minLength: 1
          example: "0909212109"
        role:
          type: string
          enum:
          - CUSTOMER
          - DRIVER
          - ADMIN
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
        email:
          type: string
          minLength: 1
          maxLength: 254
          format: email
        cid:
          type: string
          minLength: 2
          maxLength: 16
          pattern: ^c[a-z0-9]{1,15}$
        did:
          type: string
          minLength: 2
          maxLength: 16
          pattern: ^d[a-z0-9]{1,15}$
      required:
      - accountId
      - phone
      - role
      - status
      - email
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
          maxLength: 500
        requestId:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - code
      - message
      - requestId
    LoginInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          format: email
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true
      required:
      - email
      - password
    OtpChallenge:
      type: object
      additionalProperties: false
      properties:
        otpId:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: "000000000000000000000001"
        expiresAt:
          type: string
          format: date-time
          example: 2026-10-27T00:00:00Z
        mockCode:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^[0-9]{6}$
          description: Chỉ có khi OTP_MOCK_MODE=true ở demo local; không ghi log hoặc lưu plaintext.
      required:
      - otpId
      - expiresAt
    OtpVerification:
      type: object
      additionalProperties: false
      properties:
        otpId:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: "000000000000000000000001"
        verified:
          type: boolean
          enum:
          - true
        expiresAt:
          type: string
          format: date-time
          example: 2026-10-27T00:00:00Z
      required:
      - otpId
      - verified
      - expiresAt
    RegisterInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          format: email
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true
        phone:
          type: string
          minLength: 1
          example: "0909212109"
        plateNumber:
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^[^<>]*$
        code:
          type: string
          pattern: ^[0-9]{6}$
          minLength: 6
          maxLength: 6
      required:
      - email
      - password
      - phone
      oneOf:
      - not:
          anyOf:
          - required:
            - plateNumber
          - required:
            - code
      - required:
        - plateNumber
    Registration:
      type: object
      additionalProperties: false
      properties:
        accountId:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: "000000000000000000000001"
        role:
          type: string
          enum:
          - CUSTOMER
          - DRIVER
        cid:
          type: string
          minLength: 2
          maxLength: 16
          pattern: ^c[a-z0-9]{1,15}$
        did:
          type: string
          minLength: 2
          maxLength: 16
          pattern: ^d[a-z0-9]{1,15}$
      required:
      - accountId
      - role
      oneOf:
      - properties:
          role:
            enum:
            - CUSTOMER
        required:
        - cid
        not:
          required:
          - did
      - properties:
          role:
            enum:
            - DRIVER
        required:
        - did
        not:
          required:
          - cid
    RequestOtpInput:
      type: object
      additionalProperties: false
      properties:
        phone:
          type: string
          minLength: 1
          example: "0909212109"
      required:
      - phone
    Session:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
          minLength: 1
          maxLength: 4096
        account:
          $ref: "#/components/schemas/SessionAccount"
      required:
      - accessToken
      - account
    SessionAccount:
      type: object
      additionalProperties: false
      properties:
        accountId:
          type: string
          pattern: ^[0-9a-f]{24}$
        role:
          type: string
          enum: [CUSTOMER, DRIVER, ADMIN]
        cid:
          type: string
        did:
          type: string
      required: [accountId, role]
    VerifyOtpInput:
      type: object
      additionalProperties: false
      properties:
        phone:
          type: string
          minLength: 1
          example: "0909212109"
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^[0-9]{6}$
      required:
      - phone
      - code
    RegistrationOtp:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - OTP_REQUIRED
        otpId:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: "000000000000000000000001"
        expiresAt:
          type: string
          format: date-time
        mockCode:
          type: string
          pattern: ^[0-9]{6}$
      required:
      - status
      - otpId
      - expiresAt
