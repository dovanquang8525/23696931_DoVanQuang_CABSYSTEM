        '403':
          description: 'FORBIDDEN: sai role, ownership hoặc Account DISABLED.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'NOT_FOUND: đối tượng không tồn tại sau khi kiểm quyền.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
