openapi: 3.0.3
info:
  title: CAB MVP — Auth
  version: 3.0.0
  description: REST interface duy nhất của API Gateway. Thiết kế theo SRS 2.0 và Bounded Context 3.0; chưa triển
    khai backend. Chỉ BIKE/MOCK_ONLINE. Các RPC nội bộ không phải REST endpoint.
servers:
- url: http://localhost:3000/api/v1
  description: Địa chỉ local mục tiêu, không xác nhận đang chạy.
security:
- BearerAuth: []
tags:
- name: Auth
paths:
  /auth/otp-challenges:
    post:
      tags:
      - Auth
      operationId: requestDriverOtp
      summary: Yêu cầu OTP mock đăng ký Driver
      description: Phone only; purpose DRIVER_REGISTRATION is assigned internally. Existing OTP expiry, cooldown and
        limits remain unchanged.
      x-grpc: cab.auth.v1.AuthService/RequestOtp
      x-allowed-roles: []
      x-ownership: Theo metadata caller và quy tắc nghiệp vụ; không tin ID/role tự khai.
      x-srs:
      - FR43
      - AC09
      - AC10
      responses:
        "201":
          description: Thành công; dữ liệu thuộc phạm vi được phép.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallenge"
        "400":
          description: "INVALID_INPUT: sai kiểu, unknown field, miền giá trị hoặc thiếu dữ liệu."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "UNAUTHENTICATED: JWT thiếu/sai/hết hạn hoặc chữ ký callback sai."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "FORBIDDEN: sai role, ownership hoặc Account DISABLED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "NOT_FOUND: đối tượng không tồn tại sau khi kiểm quyền."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "CONFLICT: trạng thái, dữ liệu trùng, khóa idempotency khác payload hoặc operation đang xử lý."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "RATE_LIMITED: không thực hiện thêm thao tác nghiệp vụ."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          headers:
            Retry-After:
              description: Số giây còn lại trong cửa sổ rate limit.
              schema:
                type: integer
                minimum: 1
        "500":
          description: "INTERNAL_ERROR: không trả stack trace."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: DEPENDENCY_UNAVAILABLE hoặc PROFILE_NOT_READY; không giả kết quả nghiệp vụ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: DEADLINE_EXCEEDED; write có thể đã xảy ra, cần tra cứu cùng operation/key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestOtpInput"
            examples:
              demo:
                summary: Dữ liệu giả; thay ID/OTP/timestamp theo kết quả chạy thực tế.
                value:
                  phone: "0909212110"
  /auth/otp-challenges/{otpId}/verify:
    post:
      tags:
      - Auth
      operationId: verifyDriverOtp
      summary: Xác minh OTP trước khi tạo Driver Account
      description: Tối đa 5 lần sai/challenge và 10 request/phút/IP. Bằng chứng gắn otpId/phone/purpose, hết hiệu
        lực cùng expiresAt và tiêu thụ một lần tại Register.
      x-grpc: cab.auth.v1.AuthService/VerifyOtp
      x-allowed-roles: []
      x-ownership: Theo metadata caller và quy tắc nghiệp vụ; không tin ID/role tự khai.
      x-srs:
      - FR43
      - AC11
      - AC12
      responses:
        "200":
          description: Thành công; dữ liệu thuộc phạm vi được phép.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerification"
        "400":
          description: "INVALID_INPUT: sai kiểu, unknown field, miền giá trị hoặc thiếu dữ liệu."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "UNAUTHENTICATED: JWT thiếu/sai/hết hạn hoặc chữ ký callback sai."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "FORBIDDEN: sai role, ownership hoặc Account DISABLED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "NOT_FOUND: đối tượng không tồn tại sau khi kiểm quyền."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "CONFLICT: trạng thái, dữ liệu trùng, khóa idempotency khác payload hoặc operation đang xử lý."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "RATE_LIMITED: không thực hiện thêm thao tác nghiệp vụ."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          headers:
            Retry-After:
              description: Số giây còn lại trong cửa sổ rate limit.
              schema:
                type: integer
                minimum: 1
        "500":
          description: "INTERNAL_ERROR: không trả stack trace."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: DEPENDENCY_UNAVAILABLE hoặc PROFILE_NOT_READY; không giả kết quả nghiệp vụ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: DEADLINE_EXCEEDED; write có thể đã xảy ra, cần tra cứu cùng operation/key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
      parameters:
      - name: otpId
        in: path
        required: true
        schema:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: "000000000000000000000001"
        description: ""
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpInput"
            examples:
              demo:
                summary: Dữ liệu giả; thay ID/OTP/timestamp theo kết quả chạy thực tế.
                value:
                  phone: "0123"
                  code: "123456"
  /auth/register:
    post:
      tags:
      - Auth
      operationId: registerAccount
      summary: Đăng ký CUSTOMER hoặc DRIVER
      description: "Customer: email/password/phone only, cid allocated by server; returns accountId/role/cid on 201, without token, OTP or profileStatus. Login separately to obtain accessToken. Driver: add plateNumber; first
        POST returns 202 OTP_REQUIRED, no account created. Repeat same details with code (six digits) to
        complete registration, allocating did. OTP is selected by phone and bound to the original registration
        data; no otpId input. Profile remains DRAFT until license and submission. Never accepts
        role/cid/did/name."
      x-grpc: cab.auth.v1.AuthService/Register
      x-allowed-roles: []
      x-ownership: Theo metadata caller và quy tắc nghiệp vụ; không tin ID/role tự khai.
      x-srs:
      - FR01
      - AC01
      - AC02
      responses:
        "201":
          description: Thành công; dữ liệu thuộc phạm vi được phép.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "202":
          description: OTP required; account has not been created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationOtp"
        "400":
          description: "INVALID_INPUT: sai kiểu, unknown field, miền giá trị hoặc thiếu dữ liệu."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "UNAUTHENTICATED: JWT thiếu/sai/hết hạn hoặc chữ ký callback sai."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "FORBIDDEN: sai role, ownership hoặc Account DISABLED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "NOT_FOUND: đối tượng không tồn tại sau khi kiểm quyền."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "CONFLICT: trạng thái, dữ liệu trùng, khóa idempotency khác payload hoặc operation đang xử lý."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "RATE_LIMITED: không thực hiện thêm thao tác nghiệp vụ."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          headers:
            Retry-After:
              description: Số giây còn lại trong cửa sổ rate limit.
              schema:
                type: integer
                minimum: 1
        "500":
          description: "INTERNAL_ERROR: không trả stack trace."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: DEPENDENCY_UNAVAILABLE hoặc PROFILE_NOT_READY; không giả kết quả nghiệp vụ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: DEADLINE_EXCEEDED; write có thể đã xảy ra, cần tra cứu cùng operation/key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
            examples:
              customer:
                value:
                  email: cus01@gmail.com
                  password: quang123
                  phone: "0909212109"
              driverFirst:
                value:
                  email: dri01@gmail.com
                  password: quang123
                  phone: "0909212110"
                  plateNumber: 59A12345
              driverComplete:
                value:
                  email: dri01@gmail.com
                  password: quang123
                  phone: "0909212110"
                  plateNumber: 59A12345
                  code: "123456"
  /auth/login:
    post:
      tags:
      - Auth
      operationId: loginAccount
      summary: Đăng nhập và nhận JWT
      description: Login with email and password. Email is trimmed and lowercase. Verify Argon2id hash and ACTIVE
        account before issuing JWT.
      x-grpc: cab.auth.v1.AuthService/Login
      x-allowed-roles: []
      x-ownership: Theo metadata caller và quy tắc nghiệp vụ; không tin ID/role tự khai.
      x-srs:
      - FR02
      - AC05
      - AC06
      - AC92
      responses:
        "200":
          description: Thành công; dữ liệu thuộc phạm vi được phép.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: "INVALID_INPUT: sai kiểu, unknown field, miền giá trị hoặc thiếu dữ liệu."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "UNAUTHENTICATED: JWT thiếu/sai/hết hạn hoặc chữ ký callback sai."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "FORBIDDEN: sai role, ownership hoặc Account DISABLED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "NOT_FOUND: đối tượng không tồn tại sau khi kiểm quyền."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "CONFLICT: trạng thái, dữ liệu trùng, khóa idempotency khác payload hoặc operation đang xử lý."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "RATE_LIMITED: không thực hiện thêm thao tác nghiệp vụ."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          headers:
            Retry-After:
              description: Số giây còn lại trong cửa sổ rate limit.
              schema:
                type: integer
                minimum: 1
        "500":
          description: "INTERNAL_ERROR: không trả stack trace."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: DEPENDENCY_UNAVAILABLE hoặc PROFILE_NOT_READY; không giả kết quả nghiệp vụ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: DEADLINE_EXCEEDED; write có thể đã xảy ra, cần tra cứu cùng operation/key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
            examples:
              demo:
                summary: Dữ liệu giả; thay ID/OTP/timestamp theo kết quả chạy thực tế.
                value:
                  email: cus01@gmail.com
                  password: quang123
  /auth/me:
    get:
      tags:
      - Auth
      operationId: getIdentity
      summary: Xem định danh Account
      description: Xem định danh Account
      x-grpc: cab.auth.v1.AuthService/GetIdentity
      x-allowed-roles:
      - CUSTOMER
      - DRIVER
      - ADMIN
      x-ownership: Theo metadata caller và quy tắc nghiệp vụ; không tin ID/role tự khai.
      x-srs:
      - FR40
      responses:
        "200":
          description: Thành công; dữ liệu thuộc phạm vi được phép.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          description: "INVALID_INPUT: sai kiểu, unknown field, miền giá trị hoặc thiếu dữ liệu."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "UNAUTHENTICATED: JWT thiếu/sai/hết hạn hoặc chữ ký callback sai."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "FORBIDDEN: sai role, ownership hoặc Account DISABLED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "NOT_FOUND: đối tượng không tồn tại sau khi kiểm quyền."
          content:
