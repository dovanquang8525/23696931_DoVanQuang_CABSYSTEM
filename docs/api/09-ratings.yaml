openapi: 3.0.3
info:
  title: CAB MVP — Ratings
  version: 3.0.0
  description: REST interface duy nhất của API Gateway. Thiết kế theo SRS 2.0 và Bounded Context 3.0; chưa triển khai backend. Chỉ
    BIKE/MOCK_ONLINE. Các RPC nội bộ không phải REST endpoint.
servers:
  - url: http://localhost:3000/api/v1
    description: Địa chỉ local mục tiêu, không xác nhận đang chạy.
security:
  - BearerAuth: []
tags:
  - name: Ratings
paths:
  /trips/{tid}/reviews:
    post:
      tags:
        - Ratings
      operationId: createReview
      summary: Đánh giá Trip COMPLETED 1–5 sao
      description: Đúng Customer của Trip COMPLETED; một Review/Trip, duplicate 409. Không cần Payment COMPLETED; comment không HTML,
        tối đa 500 ký tự.
      x-grpc: cab.rating.v1.RatingService/CreateReview
      x-allowed-roles:
        - CUSTOMER
      x-ownership: Theo metadata caller và quy tắc nghiệp vụ; không tin ID/role tự khai.
      x-srs:
        - FR34
        - AC73
        - AC74
        - AC96
      responses:
        "201":
          description: Thành công; dữ liệu thuộc phạm vi được phép.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: "INVALID_INPUT: sai kiểu, unknown field, miền giá trị hoặc thiếu dữ liệu."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "UNAUTHENTICATED: JWT thiếu/sai/hết hạn hoặc chữ ký callback sai."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "FORBIDDEN: sai role, ownership hoặc Account DISABLED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "NOT_FOUND: đối tượng không tồn tại sau khi kiểm quyền."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "CONFLICT: trạng thái, dữ liệu trùng, khóa idempotency khác payload hoặc operation đang xử lý."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "RATE_LIMITED: không thực hiện thêm thao tác nghiệp vụ."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          headers:
            Retry-After:
              description: Số giây còn lại trong cửa sổ rate limit.
              schema:
                type: integer
                minimum: 1
        "500":
          description: "INTERNAL_ERROR: không trả stack trace."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: DEPENDENCY_UNAVAILABLE hoặc PROFILE_NOT_READY; không giả kết quả nghiệp vụ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: DEADLINE_EXCEEDED; write có thể đã xảy ra, cần tra cứu cùng operation/key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: tid
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 16
            pattern: ^t[0-9]{2,15}$
            example: t01
          description: ""
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
            examples:
              demo:
                summary: Dữ liệu giả; thay ID/OTP/timestamp theo kết quả chạy thực tế.
                value:
                  rating: 5
                  comment: Good trip
    get:
      tags:
        - Ratings
      operationId: getReviewByTrip
      summary: Tra cứu Review theo Trip
      description: Tra cứu Review theo Trip
      x-grpc: cab.rating.v1.RatingService/GetReviewByTrip
      x-allowed-roles:
        - CUSTOMER
        - DRIVER
        - ADMIN
      x-ownership: Customer của Trip, Driver được phân công hoặc ADMIN; không liên quan 403; chưa có Review 404.
      x-srs:
        - FR34
        - AC73
        - AC80
      responses:
        "200":
          description: Thành công; dữ liệu thuộc phạm vi được phép.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: "INVALID_INPUT: sai kiểu, unknown field, miền giá trị hoặc thiếu dữ liệu."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "UNAUTHENTICATED: JWT thiếu/sai/hết hạn hoặc chữ ký callback sai."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "FORBIDDEN: sai role, ownership hoặc Account DISABLED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "NOT_FOUND: đối tượng không tồn tại sau khi kiểm quyền."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "CONFLICT: trạng thái, dữ liệu trùng, khóa idempotency khác payload hoặc operation đang xử lý."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "RATE_LIMITED: không thực hiện thêm thao tác nghiệp vụ."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          headers:
            Retry-After:
              description: Số giây còn lại trong cửa sổ rate limit.
              schema:
                type: integer
                minimum: 1
        "500":
          description: "INTERNAL_ERROR: không trả stack trace."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: DEPENDENCY_UNAVAILABLE hoặc PROFILE_NOT_READY; không giả kết quả nghiệp vụ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: DEADLINE_EXCEEDED; write có thể đã xảy ra, cần tra cứu cùng operation/key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: tid
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 16
            pattern: ^t[0-9]{2,15}$
            example: t01
          description: ""
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT HS256; verify signature, issuer=cab-auth, audience=cab-api, exp và sub; không chỉ decode.
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
          maxLength: 500
        requestId:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - code
        - message
        - requestId
    Review:
      type: object
      additionalProperties: false
      properties:
        rid:
          type: string
          minLength: 3
          maxLength: 16
          pattern: ^r[0-9]{2,15}$
          example: r01
        tid:
          type: string
          minLength: 3
          maxLength: 16
          pattern: ^t[0-9]{2,15}$
          example: t01
        cid:
          type: string
          minLength: 2
          maxLength: 16
          pattern: ^c[a-z0-9]{1,15}$
          example: c01
        did:
          type: string
          minLength: 2
          maxLength: 16
          pattern: ^d[a-z0-9]{1,15}$
          example: d01
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          minLength: 0
          maxLength: 500
          pattern: ^[^<>]*$
        createdAt:
          type: string
          format: date-time
          example: 2026-10-27T00:00:00Z
      required:
        - rid
        - tid
        - cid
        - did
        - rating
        - createdAt
    ReviewInput:
      type: object
      additionalProperties: false
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          minLength: 0
          maxLength: 500
          pattern: ^[^<>]*$
      required:
        - rating
