      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: ''
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        description: ''
      - name: customerId
        in: query
        required: false
        schema:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: '000000000000000000000001'
        description: ''
      - name: driverId
        in: query
        required: false
        schema:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: '000000000000000000000001'
        description: ''
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ASSIGNED
          - ARRIVED
          - IN_PROGRESS
          - COMPLETED
          - CANCELED
        description: ''
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT HS256; verify signature, issuer=cab-auth, audience=cab-api, exp và sub; không chỉ decode.
  schemas:
    Coordinates:
      type: object
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      required:
      - latitude
      - longitude
    DriverPublic:
      type: object
      additionalProperties: false
      properties:
        driverId:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: '000000000000000000000001'
        fullName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[^<>]*$
          description: Văn bản thuần; trim trước kiểm tra. Demo từ chối dấu < > để không nhận HTML/script;
            khi hiển thị vẫn escape theo ngữ cảnh.
        vehicle:
          $ref: '#/components/schemas/Vehicle'
      required:
      - driverId
      - fullName
      - vehicle
    EmptyInput:
      type: object
      additionalProperties: false
      properties: {}
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
          maxLength: 500
        requestId:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - code
      - message
      - requestId
    Fare:
      type: integer
      minimum: 0
      maximum: 1000000000000
      nullable: true
      description: null khi chưa xác định; không dùng 0 để thay null.
    Location:
      type: object
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-27T00:00:00Z'
      required:
      - latitude
      - longitude
      - updatedAt
    Trip:
      type: object
      additionalProperties: false
      properties:
        tripId: &id001
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: '000000000000000000000001'
        bookingId: *id001
        customerId: *id001
        driverId: *id001
        vehicleId: *id001
        status:
          type: string
          enum:
          - ASSIGNED
          - ARRIVED
          - IN_PROGRESS
          - COMPLETED
          - CANCELED
        pickup:
          $ref: '#/components/schemas/Coordinates'
        destination:
          $ref: '#/components/schemas/Coordinates'
        vehicleType:
          type: string
          enum:
          - BIKE
        driver:
          $ref: '#/components/schemas/DriverPublic'
        distanceKm:
          type: number
          minimum: 0
        fareAmount:
          $ref: '#/components/schemas/Fare'
        currency:
          type: string
          enum:
          - VND
        latestLocation:
          $ref: '#/components/schemas/Location'
        assignedAt: &id002
          type: string
          format: date-time
          example: '2026-10-27T00:00:00Z'
        arrivedAt: *id002
        startedAt: *id002
        completedAt: *id002
        canceledAt: *id002
      required:
      - tripId
      - bookingId
      - customerId
      - driverId
      - vehicleId
      - status
      - pickup
      - destination
      - vehicleType
      - distanceKm
      - fareAmount
      - currency
      - assignedAt
      - driver
    TripPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 50
        totalItems:
          type: integer
          minimum: 0
          maximum: 1000000000000
      required:
      - items
      - page
      - limit
      - totalItems
    Vehicle:
      type: object
      additionalProperties: false
      properties:
        vehicleId: &id003
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: '000000000000000000000001'
        driverId: *id003
        plateNumber:
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^[^<>]*$
          description: Văn bản thuần; trim trước kiểm tra. Demo từ chối dấu < > để không nhận HTML/script;
            khi hiển thị vẫn escape theo ngữ cảnh.
        vehicleType:
          type: string
          enum:
          - BIKE
        model:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[^<>]*$
          description: Văn bản thuần; trim trước kiểm tra. Demo từ chối dấu < > để không nhận HTML/script;
            khi hiển thị vẫn escape theo ngữ cảnh.
        color:
          type: string
          minLength: 1
          maxLength: 30
          pattern: ^[^<>]*$
          description: Văn bản thuần; trim trước kiểm tra. Demo từ chối dấu < > để không nhận HTML/script;
            khi hiển thị vẫn escape theo ngữ cảnh.
        isActive:
          type: boolean
          enum:
          - true
      required:
      - vehicleId
      - driverId
      - plateNumber
      - vehicleType
      - model
      - color
      - isActive
