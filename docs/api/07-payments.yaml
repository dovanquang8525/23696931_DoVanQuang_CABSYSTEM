        cũ trước kiểm điều kiện lượt.
      x-grpc: cab.payment.v1.PaymentService/CreatePayment
      x-allowed-roles:
      - CUSTOMER
      x-ownership: Theo metadata caller và quy tắc nghiệp vụ; không tin ID/role tự khai.
      x-srs:
      - FR25
      - AC59
      - AC60
      - AC105
      responses:
        '201':
          description: Thành công; dữ liệu thuộc phạm vi được phép.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '200':
          description: 'Replay cùng khóa và payload: trả resource đã tạo, cùng ID, không tạo thêm.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: 'INVALID_INPUT: sai kiểu, unknown field, miền giá trị hoặc thiếu dữ liệu.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'UNAUTHENTICATED: JWT thiếu/sai/hết hạn hoặc chữ ký callback sai.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'FORBIDDEN: sai role, ownership hoặc Account DISABLED.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'NOT_FOUND: đối tượng không tồn tại sau khi kiểm quyền.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'CONFLICT: trạng thái, dữ liệu trùng, khóa idempotency khác payload hoặc operation đang
            xử lý.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'RATE_LIMITED: không thực hiện thêm thao tác nghiệp vụ.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Số giây còn lại trong cửa sổ rate limit.
              schema:
                type: integer
                minimum: 1
        '500':
          description: 'INTERNAL_ERROR: không trả stack trace.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: DEPENDENCY_UNAVAILABLE hoặc PROFILE_NOT_READY; không giả kết quả nghiệp vụ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: DEADLINE_EXCEEDED; write có thể đã xảy ra, cần tra cứu cùng operation/key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: '000000000000000000000001'
        description: ''
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[!-~]+$
        description: Cùng caller/đối tượng và payload trả kết quả cũ; khác payload 409. Giữ khóa suốt vòng
          đời dữ liệu demo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyInput'
            examples:
              demo:
                summary: Dữ liệu giả; thay ID/OTP/timestamp theo kết quả chạy thực tế.
                value: {}
      x-idempotency:
        required: true
        replayStatus: 200
        conflictStatus: 409
        retention: lifetime-of-demo-data
