  /payments/{paymentId}/retries:
    post:
      tags:
      - Payments
      operationId: retryPayment
      summary: Retry attempt FAILED với key mới
      description: paymentId là attempt FAILED mới nhất, không còn PENDING/COMPLETED, tổng <=3. Key replay
        trả attempt đã tạo; key mới tạo paymentId/attempt mới. Hết lượt 409, không có CASH.
      x-grpc: cab.payment.v1.PaymentService/RetryPayment
      x-allowed-roles:
      - CUSTOMER
      x-ownership: Theo metadata caller và quy tắc nghiệp vụ; không tin ID/role tự khai.
      x-srs:
      - FR27
      - AC64
      - AC65
      - AC105
      responses:
        '201':
          description: Thành công; dữ liệu thuộc phạm vi được phép.
