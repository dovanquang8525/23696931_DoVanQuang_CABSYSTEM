openapi: 3.0.3
info:
  title: CAB MVP — Payments
  version: 1.0.0
  description: REST interface duy nhất của API Gateway. Thiết kế theo SRS 2.0 và Bounded Context 3.0; chưa
    triển khai backend. Chỉ BIKE/MOCK_ONLINE. Các RPC nội bộ không phải REST endpoint.
servers:
- url: http://localhost:3000/api/v1
  description: Địa chỉ local mục tiêu, không xác nhận đang chạy.
security:
- BearerAuth: []
tags:
- name: Payments
paths:
  /trips/{tripId}/payment-summary:
    get:
      tags:
      - Payments
      operationId: getPaymentSummary
      summary: Xem cước và các attempt mock
      description: Xem cước và các attempt mock
      x-grpc: cab.payment.v1.PaymentService/GetPaymentSummary
      x-allowed-roles:
      - CUSTOMER
      - ADMIN
      x-ownership: Customer của Trip hoặc ADMIN; amount từ Trip, chưa có cước là null, chưa thanh toán là NOT_STARTED.
      x-srs:
      - FR23
      - AC56
      responses:
        '200':
          description: Thành công; dữ liệu thuộc phạm vi được phép.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSummary'
        '400':
          description: 'INVALID_INPUT: sai kiểu, unknown field, miền giá trị hoặc thiếu dữ liệu.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'UNAUTHENTICATED: JWT thiếu/sai/hết hạn hoặc chữ ký callback sai.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'FORBIDDEN: sai role, ownership hoặc Account DISABLED.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'NOT_FOUND: đối tượng không tồn tại sau khi kiểm quyền.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'CONFLICT: trạng thái, dữ liệu trùng, khóa idempotency khác payload hoặc operation đang
            xử lý.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'RATE_LIMITED: không thực hiện thêm thao tác nghiệp vụ.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Số giây còn lại trong cửa sổ rate limit.
              schema:
                type: integer
                minimum: 1
        '500':
          description: 'INTERNAL_ERROR: không trả stack trace.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: DEPENDENCY_UNAVAILABLE hoặc PROFILE_NOT_READY; không giả kết quả nghiệp vụ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: DEADLINE_EXCEEDED; write có thể đã xảy ra, cần tra cứu cùng operation/key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: '000000000000000000000001'
        description: ''
  /trips/{tripId}/payments:
    post:
      tags:
      - Payments
      operationId: createPayment
      summary: Customer khởi tạo MOCK_ONLINE sau COMPLETED
      description: Trip COMPLETED/cước hợp lệ/đúng chủ. Không nhận amount/method/status. PENDING/COMPLETED
