        '504':
          description: DEADLINE_EXCEEDED; write có thể đã xảy ra, cần tra cứu cùng operation/key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - MockSignature: []
      parameters:
      - name: X-Mock-Signature
        in: header
        required: true
        schema:
          type: string
          minLength: 71
          maxLength: 71
          pattern: ^sha256=[0-9a-f]{64}$
        description: ''
      - name: X-Mock-Timestamp
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 10
          pattern: ^[0-9]+$
        description: ''
      requestBody:
        required: true
        content:
