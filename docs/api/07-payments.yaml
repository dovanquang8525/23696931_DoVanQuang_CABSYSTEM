      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: ''
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        description: ''
      - name: tripId
        in: query
        required: false
        schema:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: '000000000000000000000001'
        description: ''
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - COMPLETED
          - FAILED
        description: ''
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT HS256; verify signature, issuer=cab-auth, audience=cab-api, exp và sub; không chỉ decode.
    MockSignature:
      type: apiKey
      in: header
      name: X-Mock-Signature
      description: Chữ ký mock; không phải token người dùng. Công thức trong docs/contracts.md.
  schemas:
    CallbackAcknowledgement:
      type: object
      additionalProperties: false
      properties:
        paymentId:
          type: string
          minLength: 24
