          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: ""
        - name: limit
          in: query
          required: false
