          example: A
        destinationCode:
          type: string
          minLength: 1
          maxLength: 16
          pattern: ^[A-Z][A-Z0-9]{0,15}$
          example: B
      description: Use pickupCode A and destinationCode B from the owning DB, or both explicit coordinates. Do not mix forms.
        Idempotency stores the original request and response snapshot.
      oneOf:
        - required:
            - pickup
            - destination
          not:
            anyOf:
              - required:
                  - pickupCode
              - required:
                  - destinationCode
        - required:
            - pickupCode
            - destinationCode
          not:
            anyOf:
              - required:
                  - pickup
              - required:
                  - destination
