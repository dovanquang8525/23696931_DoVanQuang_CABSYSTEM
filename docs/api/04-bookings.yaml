openapi: 3.0.3
info:
  title: CAB MVP — Bookings
  version: 3.0.0
  description: REST interface duy nhất của API Gateway. Thiết kế theo SRS 2.0 và Bounded Context 3.0; chưa triển khai backend. Chỉ
    BIKE/MOCK_ONLINE. Các RPC nội bộ không phải REST endpoint.
servers:
  - url: http://localhost:3000/api/v1
    description: Địa chỉ local mục tiêu, không xác nhận đang chạy.
security:
  - BearerAuth: []
tags:
  - name: Bookings
paths:
  /bookings:
    post:
      tags:
        - Bookings
      operationId: createBooking
      summary: Tạo Booking SEARCHING và tìm Driver
      description: Rate limit 10/account/phút và 120/IP/phút; hai tọa độ khác nhau, server gán BIKE và snapshot giá. Trả SEARCHING,
        không chờ 150 giây hoặc tạo Trip sớm. Cùng key không tạo vòng tìm mới.
      x-grpc: cab.booking.v1.BookingService/CreateBooking
      x-allowed-roles:
        - CUSTOMER
      x-ownership: Theo metadata caller và quy tắc nghiệp vụ; không tin ID/role tự khai.
      x-srs:
        - FR09
        - AC31
        - AC32
        - AC97
      responses:
        "200":
          description: "Replay cùng khóa và payload: trả resource đã tạo, cùng ID, không tạo thêm."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "201":
          description: Thành công; dữ liệu thuộc phạm vi được phép.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: "INVALID_INPUT: sai kiểu, unknown field, miền giá trị hoặc thiếu dữ liệu."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "UNAUTHENTICATED: JWT thiếu/sai/hết hạn hoặc chữ ký callback sai."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "FORBIDDEN: sai role, ownership hoặc Account DISABLED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "NOT_FOUND: đối tượng không tồn tại sau khi kiểm quyền."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "CONFLICT: trạng thái, dữ liệu trùng, khóa idempotency khác payload hoặc operation đang xử lý."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "RATE_LIMITED: không thực hiện thêm thao tác nghiệp vụ."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          headers:
            Retry-After:
              description: Số giây còn lại trong cửa sổ rate limit.
              schema:
                type: integer
                minimum: 1
        "500":
          description: "INTERNAL_ERROR: không trả stack trace."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: DEPENDENCY_UNAVAILABLE hoặc PROFILE_NOT_READY; không giả kết quả nghiệp vụ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: DEADLINE_EXCEEDED; write có thể đã xảy ra, cần tra cứu cùng operation/key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[!-~]+$
          description: Cùng caller/đối tượng và payload trả kết quả cũ; khác payload 409. Giữ khóa suốt vòng đời dữ liệu demo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingInput"
            examples:
              demo:
                value:
                  pickupCode: A
                  destinationCode: B
      x-idempotency:
        required: true
        replayStatus: 200
        conflictStatus: 409
        retention: lifetime-of-demo-data
    get:
      tags:
        - Bookings
      operationId: listMyBookings
      summary: Lịch sử Booking của Customer
      description: Gồm CANCELED/NO_DRIVER; sort createdAt rồi bid giảm. Ít nhất 5 Booking seed để chứng minh paging.
      x-grpc: cab.booking.v1.BookingService/ListMyBookings
      x-allowed-roles:
        - CUSTOMER
      x-ownership: Theo metadata caller và quy tắc nghiệp vụ; không tin ID/role tự khai.
      x-srs:
        - FR33
        - AC30
        - AC72
      responses:
        "200":
          description: Thành công; dữ liệu thuộc phạm vi được phép.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingPage"
        "400":
          description: "INVALID_INPUT: sai kiểu, unknown field, miền giá trị hoặc thiếu dữ liệu."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "UNAUTHENTICATED: JWT thiếu/sai/hết hạn hoặc chữ ký callback sai."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "FORBIDDEN: sai role, ownership hoặc Account DISABLED."
          content:
            application/json:
              schema:
