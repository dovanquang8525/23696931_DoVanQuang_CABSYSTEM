          description: ""
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT HS256; verify signature, issuer=cab-auth, audience=cab-api, exp và sub; không chỉ decode.
  schemas:
    Booking:
      type: object
      additionalProperties: false
      properties:
        bid:
          type: string
          minLength: 3
          maxLength: 16
          pattern: ^b[0-9]{2,15}$
          example: b01
        cid:
          type: string
          minLength: 2
          maxLength: 16
          pattern: ^c[a-z0-9]{1,15}$
          example: c01
        vehicleType:
          type: string
          enum:
            - BIKE
        pickup:
          $ref: "#/components/schemas/Coordinates"
        destination:
          $ref: "#/components/schemas/Coordinates"
        status:
          type: string
          enum:
            - SEARCHING
            - ASSIGNED
            - COMPLETED
            - CANCELED
            - NO_DRIVER
        distanceKm:
          type: number
          exclusiveMinimum: true
          minimum: 0
        pricingSnapshot:
          $ref: "#/components/schemas/PricingSnapshot"
        tid:
          type: string
          minLength: 3
          maxLength: 16
          pattern: ^t[0-9]{2,15}$
          example: t01
        did:
          type: string
          minLength: 2
          maxLength: 16
          pattern: ^d[a-z0-9]{1,15}$
        driver:
          $ref: "#/components/schemas/DriverPublic"
        createdAt:
          type: string
          format: date-time
          example: 2026-10-27T00:00:00Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-10-27T00:00:00Z
      required:
        - bid
