components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT HS256; verify signature, issuer=cab-auth, audience=cab-api, exp và sub; không chỉ decode.
  schemas:
    Booking:
      type: object
      additionalProperties: false
      properties:
        bookingId: &id001
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: '000000000000000000000001'
        customerId: *id001
        vehicleType:
          type: string
          enum:
          - BIKE
        pickup:
          $ref: '#/components/schemas/Coordinates'
        destination:
          $ref: '#/components/schemas/Coordinates'
        status:
          type: string
          enum:
          - SEARCHING
          - ASSIGNED
          - COMPLETED
          - CANCELED
          - NO_DRIVER
        distanceKm:
          type: number
          exclusiveMinimum: true
          minimum: 0
        pricingSnapshot:
          $ref: '#/components/schemas/PricingSnapshot'
        tripId: *id001
        createdAt: &id002
          type: string
          format: date-time
          example: '2026-10-27T00:00:00Z'
        updatedAt: *id002
      required:
      - bookingId
      - customerId
      - vehicleType
      - pickup
      - destination
      - status
      - distanceKm
      - pricingSnapshot
      - createdAt
      - updatedAt
