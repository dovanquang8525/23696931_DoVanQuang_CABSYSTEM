components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT HS256; verify signature, issuer=cab-auth, audience=cab-api, exp và sub; không chỉ decode.
  schemas:
    ApprovalInput:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
        reason:
          type: string
          minLength: 1
          maxLength: 300
          pattern: ^[^<>]*$
          description: Văn bản thuần; trim trước kiểm tra. Demo từ chối dấu < > để không nhận HTML/script;
            khi hiển thị vẫn escape theo ngữ cảnh.
      oneOf:
      - properties:
          decision:
            type: string
            enum:
            - APPROVED
        not:
          required:
          - reason
      - properties:
          decision:
            type: string
            enum:
            - REJECTED
        required:
        - reason
      required:
      - decision
    Availability:
      type: object
      additionalProperties: false
      properties:
        driverId:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: '000000000000000000000001'
        isOnline:
          type: boolean
      required:
      - driverId
      - isOnline
    AvailabilityInput:
      type: object
      additionalProperties: false
      properties:
        isOnline:
          type: boolean
      required:
      - isOnline
    Coordinates:
      type: object
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      required:
      - latitude
      - longitude
    Driver:
      type: object
      additionalProperties: false
      properties:
        driverId: &id001
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: '000000000000000000000001'
        accountId: *id001
        fullName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[^<>]*$
          description: Văn bản thuần; trim trước kiểm tra. Demo từ chối dấu < > để không nhận HTML/script;
            khi hiển thị vẫn escape theo ngữ cảnh.
        email:
          type: string
          minLength: 1
          maxLength: 254
          format: email
        licenseNumber:
          type: string
          minLength: 1
          maxLength: 50
          description: Chỉ owner/ADMIN; DB lưu licenseNumberEncrypted, không plaintext.
        approvalStatus:
          type: string
          enum:
          - DRAFT
          - PENDING
          - APPROVED
          - REJECTED
        isOnline:
          type: boolean
        location:
          $ref: '#/components/schemas/Location'
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        activeTripId: *id001
        rejectionReason:
          type: string
          minLength: 1
          maxLength: 300
          pattern: ^[^<>]*$
          description: Văn bản thuần; trim trước kiểm tra. Demo từ chối dấu < > để không nhận HTML/script;
            khi hiển thị vẫn escape theo ngữ cảnh.
        submittedAt: &id002
          type: string
          format: date-time
          example: '2026-10-27T00:00:00Z'
        reviewedAt: *id002
      required:
      - driverId
      - accountId
      - fullName
      - approvalStatus
      - isOnline
    DriverPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Driver'
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 50
        totalItems:
          type: integer
          minimum: 0
          maximum: 1000000000000
      required:
      - items
      - page
      - limit
      - totalItems
    DriverPublic:
      type: object
      additionalProperties: false
      properties:
        driverId:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-f]{24}$
          example: '000000000000000000000001'
        fullName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[^<>]*$
          description: Văn bản thuần; trim trước kiểm tra. Demo từ chối dấu < > để không nhận HTML/script;
            khi hiển thị vẫn escape theo ngữ cảnh.
